<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exam Management Admin - Section Builder & Bulk Question Uploader</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <style>
      .rank-tag-green { background: #10b981; color: #042416; font-weight: bold; border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35); }
      .rank-tag-yellow { background: #f59e0b; color: #2c1a00; font-weight: bold; border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3); }
      .rank-tag-red { background: #ef4444; color: #ffffff; font-weight: bold; border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3); }
      
      .wizard-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(145,179,255,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
      .sec-row { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
      .opt-editor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .opt-letter-badge { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border-radius: 8px; font-weight: bold; font-size: 0.95rem; }
      
      .subject-pill { padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); transition: all 0.15s ease; }
      .subject-pill.active { background: #5ec8ff; color: #07111f; border-color: #5ec8ff; box-shadow: 0 0 16px rgba(94,200,255,0.3); }

      .subsec-tab { padding: 6px 14px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #8ea0bf; transition: all 0.15s ease; }
      .subsec-tab.active { background: rgba(123, 255, 207, 0.15); color: #7bffcf; border-color: #7bffcf; box-shadow: 0 0 12px rgba(123, 255, 207, 0.25); }
      
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .modal-content { background: #0c182f; border: 1px solid rgba(145, 179, 255, 0.3); border-radius: 20px; max-width: 1060px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 26px; box-shadow: 0 20px 70px rgba(0,0,0,0.7); }
      
      .q-card-editor { background: rgba(255,255,255,0.03); border: 1px solid rgba(145,179,255,0.18); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
      .correct-check { width: 22px; height: 22px; accent-color: #10b981; cursor: pointer; }
      .draft-badge { background: rgba(93, 226, 155, 0.15); color: #5de29b; border: 1px solid rgba(93, 226, 155, 0.3); font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
      .bulk-sample-box { background: rgba(0,0,0,0.4); border: 1px dashed rgba(145,179,255,0.3); border-radius: 10px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: #a5c5ff; margin-bottom: 12px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="adminApp"></div>
    <div id="overlay" class="overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer"></div>
    <div id="builderModal" style="display: none;"></div>
    <div id="bulkUploadModal" style="display: none;"></div>
    <div id="studentBulkModal" style="display: none;"></div>

    <script>
      const BOOTSTRAP = {
        appName: (window.APP_CONFIG && window.APP_CONFIG.appName) || 'Exam Management Software'
      };

      const DRAFT_STORAGE_KEY = 'ems_admin_exam_draft_v4';
      const TOKEN_STORAGE_KEY = 'ems_admin_token_v4';

      const adminState = {
        token: localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem('adminToken') || '',
        view: 'overview',
        loading: false,
        dashboard: null,
        analytics: null,
        selectedAnalyticsExamId: '',
        students: [],
        exams: [],
        classes: [],
        error: '',
        editingExam: null,
        activeSubjectIndex: 0,
        activeSubSecIndex: 0,
        wizardStep: 'structure', // 'structure' or 'questions'
        draftStatus: 'Auto-saved locally ✓'
      };

      const EXAM_MODE_OPTIONS = [
        { value: 'FULL_ONLINE_EXAM', label: 'Full Online Exam (Questions on screen & Timer)' },
        { value: 'PHYSICAL_PAPER', label: 'Physical Paper / Answer Key Entry' }
      ];

      const RESULT_MODE_OPTIONS = [
        { value: 'IMMEDIATE', label: 'Show result immediately after submission' },
        { value: 'HIDDEN_UNTIL_PUBLISHED', label: 'Hide result until teacher publishes it' }
      ];

      const EXAM_STATUS_OPTIONS = ['PUBLISHED', 'ACTIVE', 'DRAFT', 'ENDED', 'ARCHIVED'];
      const SIMPLE_STATUS_OPTIONS = ['ACTIVE', 'INACTIVE'];

      // ==========================================
      // PERSISTENCE & AUTO-SAVE SHIELD
      // ==========================================
      function persistDraftToStorage() {
        if (!adminState.editingExam) {
          localStorage.removeItem(DRAFT_STORAGE_KEY);
          return;
        }
        try {
          const draftPayload = {
            editingExam: adminState.editingExam,
            wizardStep: adminState.wizardStep,
            activeSubjectIndex: adminState.activeSubjectIndex,
            activeSubSecIndex: adminState.activeSubSecIndex,
            savedAt: new Date().toISOString()
          };
          localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draftPayload));
          adminState.draftStatus = 'Auto-saved locally ✓';
          const indicator = document.getElementById('draft-indicator');
          if (indicator) indicator.textContent = 'Auto-saved locally ✓';
        } catch (e) {}
      }

      function restoreDraftFromStorage() {
        try {
          const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (data && data.editingExam && data.editingExam.subjects && data.editingExam.subjects.length) {
            adminState.editingExam = data.editingExam;
            adminState.wizardStep = data.wizardStep || 'structure';
            adminState.activeSubjectIndex = Number(data.activeSubjectIndex || 0);
            adminState.activeSubSecIndex = Number(data.activeSubSecIndex || 0);
            renderWizardModal();
            return true;
          }
        } catch (e) {}
        return false;
      }

      function discardDraft() {
        if (!confirm('Are you sure you want to discard this exam draft? All unsaved questions in this draft will be cleared.')) {
          return;
        }
        localStorage.removeItem(DRAFT_STORAGE_KEY);
        adminState.editingExam = null;
        closeWizardModal();
        renderAdmin();
      }

      function setAdminState(patch) {
        Object.assign(adminState, patch);
        renderAdmin();
      }

      function callAdmin(action, payload) {
        const apiBaseUrl = getApiBaseUrl();
        setAdminState({ loading: true, error: '' });
        return fetch(apiBaseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, ...(payload || {}) })
        }).then((response) => response.json())
          .then((result) => {
            adminState.loading = false;
            if (!result.ok) {
              throw new Error(result.error && result.error.message ? result.error.message : 'Something went wrong');
            }
            renderAdmin();
            return result.data;
          })
          .catch((err) => {
            adminState.loading = false;
            adminState.error = err && err.message ? err.message : 'Something went wrong';
            renderAdmin();
            throw err;
          });
      }

      function renderAdmin() {
        const root = document.getElementById('adminApp');
        root.innerHTML = `
          <div class="app-shell">
            ${renderAdminTopbar()}
            ${adminState.error ? `<div class="panel" style="border-color: rgba(255,113,113,.35); margin-bottom: 16px;"><div class="pill-danger">${escapeHtml(adminState.error)}</div></div>` : ''}
            ${adminState.loading ? `<div class="loading">Processing...</div>` : ''}
            ${!adminState.token ? renderAdminLogin() : renderAdminWorkspace()}
          </div>
        `;
      }

      function renderAdminTopbar() {
        return `
          <div class="topbar">
            <div class="brand">
              <div class="brand-mark">EMS</div>
              <div>
                <h1>${escapeHtml(BOOTSTRAP.appName)}</h1>
                <p>Teacher & Admin Control Center</p>
              </div>
            </div>
            <div class="row">
              <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Student Portal</button>
              ${adminState.token ? `<button type="button" class="btn btn-danger" onclick="logoutAdmin()">Logout</button>` : ''}
            </div>
          </div>
        `;
      }

      function renderAdminLogin() {
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">Teacher & Administration Portal</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(2rem, 4vw, 3.5rem); line-height:1.05;">Admin Portal Login</h2>
              <p class="muted">Enter your administrator password to access the exam builder and analytics.</p>
            </div>
            <div class="panel login-card">
              <div class="stack">
                <h3 style="margin:0;">Sign In</h3>
                <div class="field">
                  <label>Admin Password</label>
                  <input id="adminPassword" class="input" type="password" placeholder="Enter password" onkeypress="if(event.key==='Enter') loginAdmin()" />
                </div>
                <button type="button" class="btn btn-primary" onclick="loginAdmin()">Login</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderAdminWorkspace() {
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">Exam Management & School Analytics</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(1.8rem, 3.4vw, 3rem);">Dashboard & Analytics</h2>
            </div>
            <div class="grid cards-2">
              <div class="card kpi"><span class="muted">Active Students</span><strong>${adminState.dashboard ? adminState.dashboard.stats.totalStudents : 0}</strong></div>
              <div class="card kpi"><span class="muted">Submitted Attempts</span><strong>${adminState.dashboard ? adminState.dashboard.stats.submittedAttempts : 0}</strong></div>
            </div>
          </div>
          <div class="two-pane">
            <div class="panel sidebar">
              <div class="navmenu">
                ${renderNavButton('overview', 'Overview')}
                ${renderNavButton('exams', 'Exams & Question Builder')}
                ${renderNavButton('analytics', 'Performance Analytics (Heatmap)')}
                ${renderNavButton('students', 'Students')}
                ${renderNavButton('classes', 'Classes')}
              </div>
            </div>
            <div class="stack">
              ${adminState.view === 'overview' ? renderOverview() : ''}
              ${adminState.view === 'exams' ? renderExams() : ''}
              ${adminState.view === 'analytics' ? renderAnalytics() : ''}
              ${adminState.view === 'students' ? renderStudents() : ''}
              ${adminState.view === 'classes' ? renderClasses() : ''}
            </div>
          </div>
        `;
      }

      function renderNavButton(view, label) {
        return `<button type="button" class="btn btn-secondary navbtn ${adminState.view === view ? 'active' : ''}" onclick="switchAdminView('${view}')">${label}</button>`;
      }

      function renderOverview() {
        const stats = adminState.dashboard ? adminState.dashboard.stats : {};
        return `
          <div class="grid cards-4">
            <div class="card kpi"><span class="muted">Total Students</span><strong>${stats.totalStudents || 0}</strong></div>
            <div class="card kpi"><span class="muted">Active Exams</span><strong>${stats.activeExams || 0}</strong></div>
            <div class="card kpi"><span class="muted">Total Attempts</span><strong>${stats.totalAttempts || 0}</strong></div>
            <div class="card kpi"><span class="muted">Submitted</span><strong>${stats.submittedAttempts || 0}</strong></div>
          </div>
          <div class="panel">
            <div class="toolbar" style="margin-bottom:16px;">
              <h3 style="margin:0;">Teacher Quick Actions</h3>
              <button type="button" class="btn btn-secondary" onclick="refreshAdminDashboard()">Refresh Data</button>
            </div>
            <div class="row">
              <button type="button" class="btn btn-primary" onclick="openCreateExamWizard()">+ Create Test Paper & Questions</button>
              <button type="button" class="btn btn-secondary" onclick="switchAdminView('analytics')">View Heatmap Analytics</button>
              <button type="button" class="btn btn-secondary" onclick="openStudentDrawer()">Add Student</button>
              <button type="button" class="btn btn-secondary" onclick="openClassDrawer()">Add Class</button>
            </div>
          </div>
        `;
      }

      function renderExams() {
        return `
          <div class="panel">
            <div class="toolbar" style="margin-bottom:16px;">
              <div>
                <h3 style="margin:0;">Exams & Question Management</h3>
                <p class="muted" style="margin:4px 0 0; font-size:0.85rem;">Create exams assigned to specific classes or whole school, define sections, and upload questions in bulk.</p>
              </div>
              <button type="button" class="btn btn-primary" onclick="openCreateExamWizard()">+ Create New Exam Paper</button>
            </div>
            <div class="list">
              ${(adminState.exams || []).map((exam) => {
                const totalQ = (exam.subjects || []).reduce((sum, s) => sum + (s.questions ? s.questions.length : 0), 0);
                const subNames = (exam.subjects || []).map(s => s.subjectName).join(', ');
                const targetDisplay = exam.targetClass && exam.targetClass !== 'ALL' ? exam.targetClass : 'All Classes';
                return `
                  <div class="exam-card">
                    <div class="stack">
                      <div class="row">
                        <strong style="font-size:1.15rem;">${escapeHtml(exam.examName)}</strong>
                        <span class="badge" style="background:#5ec8ff/20; color:#5ec8ff;">Target: ${escapeHtml(targetDisplay)}</span>
                        <span class="badge" style="background:${exam.status === 'PUBLISHED' ? '#10b981/20' : 'rgba(255,255,255,0.1)'}; color:${exam.status === 'PUBLISHED' ? '#10b981' : '#fff'};">${escapeHtml(exam.status)}</span>
                        <span class="badge">${totalQ} Questions</span>
                      </div>
                      <div class="muted">
                        📚 Subjects: <strong>${escapeHtml(subNames || 'General')}</strong> · 📅 Date: ${escapeHtml(exam.examDate)} · ⏱️ Duration: ${escapeHtml(exam.durationMinutes)} min 
                        ${exam.availabilityStart ? `· 🟢 Live: ${new Date(exam.availabilityStart).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` : ''}
                        ${exam.availabilityEnd ? `· 🛑 Cutoff: ${new Date(exam.availabilityEnd).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}` : ''}
                      </div>
                    </div>
                    <div class="row">
                      <button type="button" class="btn btn-primary" onclick="openExistingExamWizard('${escapeJs(exam.examId)}')">📝 Edit & Bulk Upload Questions (${totalQ})</button>
                      <button type="button" class="btn btn-secondary" onclick="openExamSettingsDrawer('${escapeJs(exam.examId)}')">⚙️ Class & Timing</button>
                      <button type="button" class="btn btn-secondary" onclick="setExamStatus('${exam.examId}', 'PUBLISHED')">Publish Live</button>
                      <button type="button" class="btn btn-secondary" onclick="duplicateExam('${exam.examId}')">Duplicate</button>
                      <button type="button" class="btn btn-danger" onclick="removeExam('${exam.examId}')">Delete</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // ==========================================
      // SECTION WIZARD & QUESTION/OPTIONS EDITOR
      // ==========================================
      function openCreateExamWizard() {
        const today = new Date().toISOString().split('T')[0];
        const defaultClass = adminState.classes && adminState.classes.length ? adminState.classes[0].className : 'ALL';
        
        adminState.editingExam = {
          examId: '',
          examName: 'Main Exam Paper',
          targetClass: defaultClass,
          examDate: today,
          durationMinutes: 90,
          availabilityStart: '',
          availabilityEnd: '',
          mode: 'FULL_ONLINE_EXAM',
          resultMode: 'IMMEDIATE',
          status: 'PUBLISHED',
          assignedStudentIds: [],
          subjects: [
            {
              examSubjectId: 'sub_maths',
              subjectName: 'Mathematics',
              subSections: [
                { name: 'Section 1: Single Correct MCQs', type: 'SINGLE_CORRECT', count: 10, fullMarks: 4, partialMarks: 0, wrongMarks: -1 },
                { name: 'Section 2: Multi-Correct (Partial Marking)', type: 'MULTI_CORRECT', count: 5, fullMarks: 4, partialMarks: 1, wrongMarks: -2 },
                { name: 'Section 3: Numerical Value', type: 'INTEGER', count: 5, fullMarks: 4, partialMarks: 0, wrongMarks: 0 }
              ],
              questions: []
            },
            {
              examSubjectId: 'sub_physics',
              subjectName: 'Physics',
              subSections: [
                { name: 'Section 1: Single Correct MCQs', type: 'SINGLE_CORRECT', count: 10, fullMarks: 4, partialMarks: 0, wrongMarks: -1 },
                { name: 'Section 2: Multi-Correct (Partial Marking)', type: 'MULTI_CORRECT', count: 5, fullMarks: 4, partialMarks: 1, wrongMarks: -2 },
                { name: 'Section 3: Numerical Value', type: 'INTEGER', count: 5, fullMarks: 4, partialMarks: 0, wrongMarks: 0 }
              ],
              questions: []
            },
            {
              examSubjectId: 'sub_chem',
              subjectName: 'Chemistry',
              subSections: [
                { name: 'Section 1: Single Correct MCQs', type: 'SINGLE_CORRECT', count: 10, fullMarks: 4, partialMarks: 0, wrongMarks: -1 },
                { name: 'Section 2: Multi-Correct (Partial Marking)', type: 'MULTI_CORRECT', count: 5, fullMarks: 4, partialMarks: 1, wrongMarks: -2 },
                { name: 'Section 3: Numerical Value', type: 'INTEGER', count: 5, fullMarks: 4, partialMarks: 0, wrongMarks: 0 }
              ],
              questions: []
            }
          ]
        };
        adminState.activeSubjectIndex = 0;
        adminState.activeSubSecIndex = 0;
        adminState.wizardStep = 'structure';
        persistDraftToStorage();
        renderWizardModal();
      }

      async function openExistingExamWizard(examId) {
        let exam = await callAdmin('getExamDetail', { token: adminState.token, examId });
        adminState.editingExam = JSON.parse(JSON.stringify(exam));
        adminState.activeSubjectIndex = 0;
        adminState.activeSubSecIndex = 0;
        const totalQ = adminState.editingExam.subjects.reduce((sum, s) => sum + (s.questions ? s.questions.length : 0), 0);
        adminState.wizardStep = totalQ > 0 ? 'questions' : 'structure';
        persistDraftToStorage();
        renderWizardModal();
      }

      function renderWizardModal() {
        const modal = document.getElementById('builderModal');
        const exam = adminState.editingExam;
        if (!exam) return;

        modal.style.display = 'flex';
        modal.className = 'modal-backdrop';

        if (adminState.wizardStep === 'structure') {
          modal.innerHTML = renderStructureStep(exam);
        } else {
          modal.innerHTML = renderQuestionsStep(exam);
        }
      }

      function renderStructureStep(exam) {
        const classList = (adminState.classes || []).map(c => c.className).filter(Boolean);
        const uniqueClasses = Array.from(new Set(['ALL', 'Class 10', 'Class 11', 'Class 12', ...classList]));

        return `
          <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:14px; margin-bottom:18px;">
              <div>
                <span class="badge" style="background:#5ec8ff; color:#03111d; font-weight:bold;">Step 1: Exam Structure & Target Class</span>
                <h2 style="margin:6px 0 0; font-size:1.35rem;">Define Blueprint & Assign Class</h2>
              </div>
              <div class="row">
                <span class="draft-badge" id="draft-indicator">💾 Auto-saved locally ✓</span>
                <button type="button" class="btn btn-danger" style="padding:6px 12px; font-size:0.8rem;" onclick="discardDraft()">Discard Draft</button>
                <button type="button" class="btn btn-secondary" onclick="closeWizardModal()">Close</button>
              </div>
            </div>

            <!-- Meta & Target Class -->
            <div class="grid cards-3" style="margin-bottom:16px;">
              ${renderField('Exam Title / Name', 'wizardExamName', exam.examName || '', 'text', 'updateExamMeta("examName", this.value)')}
              
              <div class="field">
                <label style="font-weight:600; color:#7bffcf;">🎯 Target Class / Grade</label>
                <select class="select" style="font-weight:bold;" onchange="updateExamMeta('targetClass', this.value)">
                  ${uniqueClasses.map(cls => `
                    <option value="${escapeAttribute(cls)}" ${(exam.targetClass || 'ALL') === cls ? 'selected' : ''}>
                      ${cls === 'ALL' ? '🌟 All Enrolled Classes (Whole School)' : escapeHtml(cls)}
                    </option>
                  `).join('')}
                </select>
              </div>

              ${renderField('Exam Duration (Minutes)', 'wizardDuration', exam.durationMinutes || 90, 'number', 'updateExamMeta("durationMinutes", Number(this.value))')}
            </div>

            <div class="stack">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-weight:600; font-size:0.95rem; color:#5ec8ff;">MAIN SUBJECTS (${exam.subjects.length}):</label>
                <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:4px 10px;" onclick="addSubjectToWizard()">+ Add Subject (e.g. Maths, Physics, Chemistry)</button>
              </div>

              ${exam.subjects.map((sub, sIdx) => `
                <div class="wizard-box">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                      <span class="badge">Subject ${sIdx + 1}</span>
                      <input type="text" class="input" style="width:220px; font-weight:bold;" value="${escapeAttribute(sub.subjectName)}" oninput="updateSubjectName(${sIdx}, this.value)" placeholder="Subject Name" />
                    </div>
                    <div class="row">
                      <button type="button" class="btn btn-secondary" style="font-size:0.75rem; padding:4px 10px;" onclick="addSubSection(${sIdx})">+ Add Sub-Section</button>
                      ${exam.subjects.length > 1 ? `<button type="button" class="btn btn-danger" style="font-size:0.75rem; padding:4px 10px;" onclick="removeSubjectFromWizard(${sIdx})">Remove Subject</button>` : ''}
                    </div>
                  </div>

                  <div class="stack">
                    ${(sub.subSections || []).map((sec, secIdx) => `
                      <div class="sec-row">
                        <div style="display:grid; grid-template-columns: 2fr 1.6fr 1fr 1fr 1fr 1fr auto; gap:8px; align-items:center;">
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;">Sub-Section Title</label>
                            <input type="text" class="input" value="${escapeAttribute(sec.name || '')}" oninput="updateSubSec(${sIdx}, ${secIdx}, 'name', this.value)" placeholder="e.g. Section 1 (MCQs)" />
                          </div>
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;">Question Type</label>
                            <select class="select" onchange="updateSubSec(${sIdx}, ${secIdx}, 'type', this.value)">
                              <option value="SINGLE_CORRECT" ${sec.type === 'SINGLE_CORRECT' ? 'selected' : ''}>Single Correct (MCQ)</option>
                              <option value="MULTI_CORRECT" ${sec.type === 'MULTI_CORRECT' ? 'selected' : ''}>Multiple Correct (Partial Mark)</option>
                              <option value="INTEGER" ${sec.type === 'INTEGER' ? 'selected' : ''}>Numerical / Integer</option>
                            </select>
                          </div>
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;"># Questions</label>
                            <input type="number" class="input" min="1" value="${sec.count || 10}" oninput="updateSubSec(${sIdx}, ${secIdx}, 'count', Number(this.value))" />
                          </div>
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;">+ Full</label>
                            <input type="number" class="input" value="${sec.fullMarks !== undefined ? sec.fullMarks : 4}" oninput="updateSubSec(${sIdx}, ${secIdx}, 'fullMarks', Number(this.value))" />
                          </div>
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;">+ Partial</label>
                            <input type="number" class="input" value="${sec.partialMarks !== undefined ? sec.partialMarks : 1}" oninput="updateSubSec(${sIdx}, ${secIdx}, 'partialMarks', Number(this.value))" />
                          </div>
                          <div>
                            <label style="font-size:0.75rem; color:#8ea0bf;">- Penalty</label>
                            <input type="number" class="input" value="${sec.wrongMarks !== undefined ? sec.wrongMarks : -1}" oninput="updateSubSec(${sIdx}, ${secIdx}, 'wrongMarks', Number(this.value))" />
                          </div>
                          <div style="padding-top:16px;">
                            ${(sub.subSections || []).length > 1 ? `<button type="button" class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="removeSubSection(${sIdx}, ${secIdx})">×</button>` : ''}
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:16px;">
              <div class="muted" style="font-size:0.85rem;">
                Total Questions Blueprint: <strong>${calculateTotalQuestions(exam)}</strong> · Target: <strong>${escapeHtml(exam.targetClass || 'ALL')}</strong>
              </div>
              <button type="button" class="btn btn-primary" style="font-size:1rem; padding:10px 24px;" onclick="generatePaperQuestions()">
                🚀 Proceed to Question Builder & Bulk Uploader →
              </button>
            </div>
          </div>
        `;
      }

      function calculateTotalQuestions(exam) {
        let count = 0;
        (exam.subjects || []).forEach(sub => {
          (sub.subSections || []).forEach(sec => {
            count += Number(sec.count || 0);
          });
        });
        return count;
      }

      function updateExamMeta(field, val) {
        adminState.editingExam[field] = val;
        persistDraftToStorage();
      }
      function updateSubjectName(sIdx, val) {
        adminState.editingExam.subjects[sIdx].subjectName = val;
        persistDraftToStorage();
      }
      function addSubjectToWizard() {
        adminState.editingExam.subjects.push({
          examSubjectId: 'sub_' + Date.now(),
          subjectName: 'New Subject',
          subSections: [{ name: 'Section 1: Single Correct', type: 'SINGLE_CORRECT', count: 10, fullMarks: 4, partialMarks: 0, wrongMarks: -1 }],
          questions: []
        });
        persistDraftToStorage();
        renderWizardModal();
      }
      function removeSubjectFromWizard(sIdx) {
        adminState.editingExam.subjects.splice(sIdx, 1);
        persistDraftToStorage();
        renderWizardModal();
      }
      function addSubSection(sIdx) {
        const sub = adminState.editingExam.subjects[sIdx];
        if (!sub.subSections) sub.subSections = [];
        const nextNum = sub.subSections.length + 1;
        sub.subSections.push({ name: `Section ${nextNum}`, type: 'SINGLE_CORRECT', count: 5, fullMarks: 4, partialMarks: 1, wrongMarks: -1 });
        persistDraftToStorage();
        renderWizardModal();
      }
      function removeSubSection(sIdx, secIdx) {
        adminState.editingExam.subjects[sIdx].subSections.splice(secIdx, 1);
        persistDraftToStorage();
        renderWizardModal();
      }
      function updateSubSec(sIdx, secIdx, field, val) {
        adminState.editingExam.subjects[sIdx].subSections[secIdx][field] = val;
        persistDraftToStorage();
      }

      function generatePaperQuestions() {
        const exam = adminState.editingExam;
        let globalQNum = 1;

        exam.subjects.forEach(sub => {
          // If questions already exist and match count, preserve them
          const existingQs = sub.questions || [];
          const generatedQuestions = [];
          
          (sub.subSections || []).forEach(sec => {
            const count = Number(sec.count || 5);
            // find existing questions for this sub section
            const secExisting = existingQs.filter(q => q.subSectionName === sec.name);
            for (let i = 0; i < count; i++) {
              if (secExisting[i]) {
                const preserved = secExisting[i];
                preserved.questionNumber = globalQNum;
                preserved.questionType = sec.type;
                preserved.fullMarks = sec.fullMarks !== undefined ? sec.fullMarks : 4;
                preserved.partialMarks = sec.partialMarks !== undefined ? sec.partialMarks : 1;
                preserved.wrongMarks = sec.wrongMarks !== undefined ? sec.wrongMarks : -1;
                generatedQuestions.push(preserved);
              } else {
                generatedQuestions.push({
                  questionId: 'q_' + Date.now() + '_' + globalQNum,
                  subSectionName: sec.name,
                  questionNumber: globalQNum,
                  questionType: sec.type,
                  questionText: '',
                  imageUrl: '',
                  options: [
                    { id: 'A', label: '' },
                    { id: 'B', label: '' },
                    { id: 'C', label: '' },
                    { id: 'D', label: '' }
                  ],
                  correctAnswer: sec.type === 'INTEGER' ? '0' : 'A',
                  fullMarks: sec.fullMarks !== undefined ? sec.fullMarks : 4,
                  partialMarks: sec.partialMarks !== undefined ? sec.partialMarks : 1,
                  wrongMarks: sec.wrongMarks !== undefined ? sec.wrongMarks : -1
                });
              }
              globalQNum++;
            }
          });
          sub.questions = generatedQuestions;
        });

        adminState.wizardStep = 'questions';
        adminState.activeSubjectIndex = 0;
        adminState.activeSubSecIndex = 0;
        persistDraftToStorage();
        renderWizardModal();
      }

      // STEP 2: RICH QUESTION, SUB-SECTION TABS & BULK UPLOADER
      function renderQuestionsStep(exam) {
        const currentSubject = exam.subjects[adminState.activeSubjectIndex] || exam.subjects[0];
        const subSections = (currentSubject && currentSubject.subSections) || [];
        const isWholeSubjectTab = adminState.activeSubSecIndex === -1;
        const activeSubSec = !isWholeSubjectTab ? (subSections[adminState.activeSubSecIndex] || subSections[0] || { name: 'Section 1', type: 'SINGLE_CORRECT' }) : null;
        
        const allQuestionsInSubject = currentSubject ? (currentSubject.questions || []) : [];
        const filteredQuestions = isWholeSubjectTab 
          ? allQuestionsInSubject 
          : allQuestionsInSubject.filter(q => q.subSectionName === activeSubSec.name);

        const totalQ = exam.subjects.reduce((sum, s) => sum + (s.questions ? s.questions.length : 0), 0);

        return `
          <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:14px;">
              <div>
                <span class="badge" style="background:#5de29b; color:#03111d; font-weight:bold;">Step 2: Questions & Bulk Uploader</span>
                <h2 style="margin:6px 0 0; font-size:1.35rem;">${escapeHtml(exam.examName)}</h2>
                <div class="row" style="margin-top:4px;">
                  <span class="badge" style="background:#5ec8ff/20; color:#5ec8ff;">Class: ${escapeHtml(exam.targetClass || 'ALL')}</span>
                  <span class="badge">${totalQ} Total Questions</span>
                  <span class="badge">⏱️ ${exam.durationMinutes} Min</span>
                </div>
              </div>
              <div class="row">
                <span class="draft-badge" id="draft-indicator">💾 Auto-saved locally ✓</span>
                <button type="button" class="btn btn-secondary" onclick="adminState.wizardStep='structure'; persistDraftToStorage(); renderWizardModal();">← Edit Structure</button>
                <button type="button" class="btn btn-danger" style="padding:6px 12px; font-size:0.8rem;" onclick="discardDraft()">Discard</button>
                <button type="button" class="btn btn-primary" onclick="saveAllWizardQuestions()">💾 Save & Publish Exam</button>
              </div>
            </div>

            <!-- Subject Navigation Tabs -->
            <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
              ${exam.subjects.map((sub, idx) => `
                <div class="subject-pill ${idx === adminState.activeSubjectIndex ? 'active' : ''}" onclick="adminState.activeSubjectIndex=${idx}; adminState.activeSubSecIndex=-1; persistDraftToStorage(); renderWizardModal();">
                  📚 ${escapeHtml(sub.subjectName)} (${(sub.questions || []).length} Qs)
                </div>
              `).join('')}
            </div>

            <!-- Sub-Section Tabs within the Active Subject -->
            <div style="background:rgba(0,0,0,0.25); border:1px solid rgba(145,179,255,0.15); border-radius:14px; padding:14px; margin-bottom:18px;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                  <!-- Whole Subject Tab -->
                  <div class="subsec-tab ${isWholeSubjectTab ? 'active' : ''}" style="${isWholeSubjectTab ? 'background:rgba(94,200,255,0.2); color:#5ec8ff; border-color:#5ec8ff;' : ''}" onclick="adminState.activeSubSecIndex=-1; persistDraftToStorage(); renderWizardModal();">
                    📁 Whole Subject (All ${allQuestionsInSubject.length} Qs)
                  </div>
                  <!-- Individual Sub-Section Tabs -->
                  ${subSections.map((sec, secIdx) => {
                    const qCount = allQuestionsInSubject.filter(q => q.subSectionName === sec.name).length;
                    return `
                      <div class="subsec-tab ${secIdx === adminState.activeSubSecIndex ? 'active' : ''}" onclick="adminState.activeSubSecIndex=${secIdx}; persistDraftToStorage(); renderWizardModal();">
                        ⚡ ${escapeHtml(sec.name)} · <span style="opacity:0.85;">${qCount} Qs</span>
                      </div>
                    `;
                  }).join('')}
                </div>
                
                <div class="row">
                  <button type="button" class="btn btn-primary" style="font-size:0.8rem; padding:6px 14px;" onclick="openBulkUploadModal('WHOLE_SUBJECT')">
                    📥 Bulk Upload Whole Subject
                  </button>
                  ${!isWholeSubjectTab ? `
                    <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:6px 12px; background:rgba(123,255,207,0.12); border-color:#7bffcf; color:#7bffcf;" onclick="openBulkUploadModal('SUB_SECTION')">
                      📥 Bulk Upload This Sub-Section
                    </button>
                  ` : ''}
                  <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:6px 12px;" onclick="${isWholeSubjectTab ? 'downloadWholeSubjectCsvTemplate()' : 'downloadSubSectionCsvTemplate()'}">
                    📄 Download ${isWholeSubjectTab ? 'Whole Subject' : 'Sub-Section'} CSV Template
                  </button>
                  <button type="button" class="btn btn-secondary" style="font-size:0.8rem; padding:6px 12px;" onclick="addNewQuestionToActiveSubSec()">
                    + Add Single Q
                  </button>
                </div>
              </div>

              <!-- Active Sub-Section Info Badge -->
              <div class="muted" style="font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.06); padding-top:10px;">
                ${isWholeSubjectTab ? `
                  <span>Viewing <strong>All Sub-Sections</strong> in <strong>${escapeHtml(currentSubject.subjectName)}</strong> (${subSections.length} sub-sections defined)</span>
                  <span>Total questions in subject: <strong>${allQuestionsInSubject.length}</strong></span>
                ` : `
                  <span>Sub-Section: <strong>${escapeHtml(activeSubSec.name)}</strong> · Type: <strong style="color:var(--accent);">${activeSubSec.type}</strong> · Marks: <strong style="color:#10b981;">+${activeSubSec.fullMarks || 4}</strong> / <strong style="color:#ef4444;">${activeSubSec.wrongMarks || -1}</strong> ${activeSubSec.type === 'MULTI_CORRECT' ? `· <strong style="color:#f59e0b;">+${activeSubSec.partialMarks || 1} Partial</strong>` : ''}</span>
                  <span>Questions in this sub-section: <strong>${filteredQuestions.length}</strong></span>
                `}
              </div>
            </div>

            <!-- Question & Option Editors List for this Sub-Section -->
            <div class="stack">
              ${filteredQuestions.length ? filteredQuestions.map((q) => {
                const globalIndex = allQuestionsInSubject.indexOf(q);
                return renderQuestionFullEditor(q, globalIndex);
              }).join('') : `
                <div class="panel" style="text-align:center; padding:32px;">
                  <p class="muted">No questions yet in this ${isWholeSubjectTab ? 'subject' : 'sub-section'}.</p>
                  <div class="row" style="justify-content:center; gap:12px;">
                    <button type="button" class="btn btn-primary" onclick="openBulkUploadModal('${isWholeSubjectTab ? 'WHOLE_SUBJECT' : 'SUB_SECTION'}')">📥 Bulk Upload CSV / Paste Questions</button>
                    <button type="button" class="btn btn-secondary" onclick="addNewQuestionToActiveSubSec()">+ Add Single Question</button>
                  </div>
                </div>
              `}
            </div>

            <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
              <span class="draft-badge">💾 All keystrokes auto-saved to device</span>
              <div class="row">
                <button type="button" class="btn btn-secondary" onclick="closeWizardModal()">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveAllWizardQuestions()">💾 Save All Questions to Cloud</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderQuestionFullEditor(q, qIndex) {
        const isMulti = q.questionType === 'MULTI_CORRECT';
        const isInteger = q.questionType === 'INTEGER';
        const options = q.options && q.options.length ? q.options : [
          { id: 'A', label: '' }, { id: 'B', label: '' }, { id: 'C', label: '' }, { id: 'D', label: '' }
        ];

        return `
          <div class="q-card-editor">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div class="row">
                <span class="badge" style="background:#5ec8ff; color:#000; font-weight:bold; font-size:0.9rem;">Q${q.questionNumber}</span>
                <span class="badge">${escapeHtml(q.subSectionName || 'Section')}</span>
                <span class="badge" style="color:var(--accent); font-weight:bold;">${escapeHtml(q.questionType)}</span>
                <span class="badge">+${q.fullMarks} / ${q.wrongMarks} ${isMulti ? `(Partial: +${q.partialMarks || 1})` : ''}</span>
              </div>
              <button type="button" class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteQuestionAt(${qIndex})">Delete Q</button>
            </div>

            <!-- Question Statement Textarea -->
            <div class="field" style="margin-bottom:12px;">
              <label style="font-weight:600; font-size:0.85rem;">Question Statement</label>
              <textarea class="textarea" style="min-height:65px; font-size:0.95rem;" placeholder="Type or paste the full question statement here..." oninput="updateQFieldDirect(${qIndex}, 'questionText', this.value)">${escapeHtml(q.questionText || '')}</textarea>
            </div>

            <!-- Diagram URL -->
            <div class="field" style="margin-bottom:14px;">
              <label style="font-size:0.8rem; color:#8ea0bf;">Optional Diagram / Image URL</label>
              <input type="url" class="input" style="font-size:0.85rem;" placeholder="https://example.com/diagram.png" value="${escapeAttribute(q.imageUrl || '')}" oninput="updateQFieldDirect(${qIndex}, 'imageUrl', this.value)" />
            </div>

            <!-- Options or Integer Answer -->
            ${isInteger ? `
              <div class="field">
                <label style="font-weight:600; font-size:0.85rem; color:#5de29b;">Correct Numerical Value Answer</label>
                <input type="text" class="input" style="width:200px; font-weight:bold; font-size:1rem;" value="${escapeAttribute(q.correctAnswer || '')}" oninput="updateQFieldDirect(${qIndex}, 'correctAnswer', this.value)" placeholder="e.g. 24 or 3.14" />
              </div>
            ` : `
              <div class="stack">
                <label style="font-weight:600; font-size:0.85rem;">Options & Correct Answer Selection</label>
                ${options.map((opt, optIdx) => {
                  const isChecked = isMulti 
                    ? String(q.correctAnswer || '').toUpperCase().includes(opt.id)
                    : String(q.correctAnswer || '').trim().toUpperCase() === opt.id;

                  return `
                    <div class="opt-editor-row">
                      <input type="${isMulti ? 'checkbox' : 'radio'}" name="correct_opt_${qIndex}" class="correct-check" ${isChecked ? 'checked' : ''} onchange="setQuestionCorrectOption(${qIndex}, '${opt.id}', ${isMulti})" title="Click to mark this option as correct" />
                      <div class="opt-letter-badge">${opt.id}</div>
                      <input type="text" class="input" style="font-size:0.9rem;" value="${escapeAttribute(opt.label || '')}" placeholder="Option ${opt.id} text (optional)" oninput="updateOptionLabel(${qIndex}, ${optIdx}, this.value)" />
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }

      function updateQFieldDirect(qIndex, field, val) {
        const sub = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        sub.questions[qIndex][field] = val;
        persistDraftToStorage();
      }

      function updateOptionLabel(qIndex, optIdx, val) {
        const sub = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        if (!sub.questions[qIndex].options) {
          sub.questions[qIndex].options = [{ id: 'A', label: '' }, { id: 'B', label: '' }, { id: 'C', label: '' }, { id: 'D', label: '' }];
        }
        sub.questions[qIndex].options[optIdx].label = val;
        persistDraftToStorage();
      }

      function setQuestionCorrectOption(qIndex, optId, isMulti) {
        const sub = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        const q = sub.questions[qIndex];
        if (isMulti) {
          let cur = String(q.correctAnswer || '').split('').filter(c => c.match(/[A-Z]/));
          const idx = cur.indexOf(optId);
          if (idx > -1) cur.splice(idx, 1);
          else cur.push(optId);
          q.correctAnswer = cur.sort().join('');
        } else {
          q.correctAnswer = optId;
        }
        persistDraftToStorage();
      }

      function deleteQuestionAt(qIndex) {
        const sub = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        sub.questions.splice(qIndex, 1);
        recalcGlobalQuestionNumbers();
        persistDraftToStorage();
        renderWizardModal();
      }

      function addNewQuestionToActiveSubSec() {
        const sub = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        const sec = sub.subSections[adminState.activeSubSecIndex] || { name: 'Section 1', type: 'SINGLE_CORRECT', fullMarks: 4, partialMarks: 1, wrongMarks: -1 };
        
        if (!sub.questions) sub.questions = [];
        sub.questions.push({
          questionId: 'q_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          subSectionName: sec.name,
          questionNumber: 1,
          questionType: sec.type,
          questionText: '',
          imageUrl: '',
          options: [{ id: 'A', label: '' }, { id: 'B', label: '' }, { id: 'C', label: '' }, { id: 'D', label: '' }],
          correctAnswer: sec.type === 'INTEGER' ? '0' : 'A',
          fullMarks: sec.fullMarks !== undefined ? sec.fullMarks : 4,
          partialMarks: sec.partialMarks !== undefined ? sec.partialMarks : 1,
          wrongMarks: sec.wrongMarks !== undefined ? sec.wrongMarks : -1
        });
        recalcGlobalQuestionNumbers();
        persistDraftToStorage();
        renderWizardModal();
      }

      function recalcGlobalQuestionNumbers() {
        let num = 1;
        (adminState.editingExam.subjects || []).forEach(s => {
          (s.questions || []).forEach(q => {
            q.questionNumber = num++;
          });
        });
      }

      function closeWizardModal() {
        document.getElementById('builderModal').style.display = 'none';
      }

      async function saveAllWizardQuestions() {
        const exam = adminState.editingExam;
        if (!exam.examName || !exam.examDate) {
          alert('Exam Name and Date are required.');
          return;
        }
        try {
          exam.status = 'PUBLISHED';
          await callAdmin('saveExam', { token: adminState.token, data: exam });
          localStorage.removeItem(DRAFT_STORAGE_KEY);
          adminState.editingExam = null;
          closeWizardModal();
          alert('✅ Exam & all questions/options saved to cloud successfully! Live for assigned class.');
          await hydrateAdmin();
        } catch (e) {
          alert('Error saving exam: ' + e.message);
        }
      }

      // ==========================================
      // BULK UPLOAD MODAL & CSV PARSER ENGINE
      // ==========================================
      function openBulkUploadModal(targetMode) {
        const modal = document.getElementById('bulkUploadModal');
        const currentSubject = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        const isWhole = (targetMode === 'WHOLE_SUBJECT') || (adminState.activeSubSecIndex === -1);
        const subSections = currentSubject.subSections || [];
        const activeSubSec = !isWhole ? (subSections[adminState.activeSubSecIndex] || subSections[0]) : null;

        modal.style.display = 'flex';
        modal.className = 'modal-backdrop';
        modal.innerHTML = `
          <div class="modal-content" style="max-width:880px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px; margin-bottom:16px;">
              <div>
                <span class="badge" style="background:#5ec8ff; color:#03111d; font-weight:bold;">🚀 Bulk Question Uploader</span>
                <h3 style="margin:4px 0 0;">
                  ${isWhole ? `Whole Subject: <strong>${escapeHtml(currentSubject.subjectName)}</strong> (All Sub-Sections)` : `Sub-Section Tab: <strong>${escapeHtml(activeSubSec.name)}</strong>`}
                </h3>
              </div>
              <button type="button" class="btn btn-secondary" onclick="closeBulkUploadModal()">✕ Cancel</button>
            </div>

            <!-- Target Selection Dropdown -->
            <div class="field" style="margin-bottom:14px;">
              <label style="font-weight:600; color:#7bffcf;">🎯 Upload Target Destination:</label>
              <select id="bulkTargetSelect" class="select" style="font-weight:bold;" onchange="onBulkTargetChange(this.value)">
                <option value="WHOLE_SUBJECT" ${isWhole ? 'selected' : ''}>📁 Entire Subject (${escapeHtml(currentSubject.subjectName)}) - All Sub-Sections in one sheet</option>
                ${subSections.map((sec, idx) => `
                  <option value="${idx}" ${!isWhole && idx === adminState.activeSubSecIndex ? 'selected' : ''}>⚡ Sub-Section Tab: ${escapeHtml(sec.name)} (${sec.type})</option>
                `).join('')}
              </select>
            </div>

            <!-- Expected Format Guide -->
            <div class="stack" id="bulkFormatGuide" style="margin-bottom:14px;">
              ${renderBulkFormatGuide(isWhole ? 'WHOLE_SUBJECT' : adminState.activeSubSecIndex, currentSubject)}
            </div>

            <!-- Paste Input Area -->
            <div class="field" style="margin-bottom:14px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <label style="font-weight:600; font-size:0.85rem;">📋 Paste rows from Excel / Google Sheets / CSV (One line per question):</label>
                <button type="button" class="btn btn-secondary" style="font-size:0.75rem; padding:3px 8px;" onclick="loadSampleQuestionsIntoPasteBox()">Insert Sample Data</button>
              </div>
              <textarea id="bulkPasteInput" class="textarea" style="min-height:160px; font-family:monospace; font-size:0.85rem;" placeholder="Paste rows here..."></textarea>
            </div>

            <!-- File Selector Input -->
            <div class="field" style="margin-bottom:16px;">
              <label style="font-size:0.8rem; color:#8ea0bf;">📁 Or Upload a .CSV / .TXT / .TSV File:</label>
              <input type="file" id="bulkFileInput" accept=".csv,.txt,.tsv" class="input" onchange="handleBulkFileSelect(this)" />
            </div>

            <!-- Action Controls -->
            <div class="row" style="justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.1); padding-top:14px;">
              <div class="row">
                <label style="font-size:0.85rem; cursor:pointer;">
                  <input type="radio" name="bulkImportMode" value="REPLACE" checked /> Replace existing in target

      function executeBulkImport() {
        const rawText = document.getElementById('bulkPasteInput').value.trim();
        if (!rawText) {
          alert('Please paste or upload question lines first.');
          return;
        }

        const currentSubject = adminState.editingExam.subjects[adminState.activeSubjectIndex];
        const subSections = currentSubject.subSections || [];
        const targetVal = document.getElementById('bulkTargetSelect').value;
        const isWhole = targetVal === 'WHOLE_SUBJECT';
        const activeSubSec = !isWhole ? (subSections[Number(targetVal)] || subSections[0]) : null;
        const mode = document.querySelector('input[name="bulkImportMode"]:checked').value;

        const lines = rawText.split(/\r?\n/).filter(line => line.trim().length > 0);
        const parsedQuestions = [];

        lines.forEach((line, idx) => {
          // If first line is header row, skip
          const lower = line.toLowerCase();
          if (idx === 0 && (lower.includes('question') || lower.includes('option a') || lower.includes('subsection'))) {
            return;
          }

          // Parse delimited by tab or pipe or CSV comma
          let cols = [];
          if (line.includes('\t')) {
            cols = line.split('\t').map(c => c.trim().replace(/^["']|["']$/g, ''));
          } else if (line.includes('|')) {
            cols = line.split('|').map(c => c.trim().replace(/^["']|["']$/g, ''));
          } else {
            cols = parseCsvLine(line);
          }

          if (!cols || !cols.length || !cols[0]) return;

          if (isWhole) {
            // Whole Subject Format:
            // Col 0: SubSection Name (e.g. "Section 1")
            // Col 1: Question Type (SINGLE_CORRECT / MULTI_CORRECT / INTEGER)
            // Col 2: Question Text
            // Col 3: Option A
            // Col 4: Option B
            // Col 5: Option C
            // Col 6: Option D
            // Col 7: Correct Answer
            // Col 8: Full Marks
            // Col 9: Wrong Marks
            // Col 10: Image URL
            let secName = cols[0].trim();
            let qType = (cols[1] || 'SINGLE_CORRECT').trim().toUpperCase();
            let qText = cols[2] || '';
            let optA = cols[3] || '';
            let optB = cols[4] || '';
            let optC = cols[5] || '';
            let optD = cols[6] || '';
            let correctAns = cols[7] || '';
            let fullM = cols[8] !== undefined && cols[8] !== '' ? Number(cols[8]) : 4;
            let wrongM = cols[9] !== undefined && cols[9] !== '' ? Number(cols[9]) : -1;
            let imgUrl = cols[10] || '';

            // Auto-match or create sub-section if not exists
            let matchedSec = subSections.find(s => s.name.toLowerCase() === secName.toLowerCase());
            if (!matchedSec) {
              matchedSec = subSections[0] || { name: secName || 'Section 1', type: qType, fullMarks: fullM, wrongMarks: wrongM };
              secName = matchedSec.name;
            }

            if (qType === 'INTEGER' || matchedSec.type === 'INTEGER') {
              parsedQuestions.push({
                questionId: 'q_' + Date.now() + '_' + (idx + 1) + '_' + Math.floor(Math.random()*1000),
                subSectionName: secName,
                questionNumber: 1,
                questionType: 'INTEGER',
                questionText: qText || optA, // in case user shifted columns
                imageUrl: imgUrl,
                options: [],
                correctAnswer: correctAns || optB || '0',
                fullMarks: fullM,
                partialMarks: 0,
                wrongMarks: wrongM || 0
              });
            } else {
              parsedQuestions.push({
                questionId: 'q_' + Date.now() + '_' + (idx + 1) + '_' + Math.floor(Math.random()*1000),
                subSectionName: secName,
                questionNumber: 1,
                questionType: qType || matchedSec.type || 'SINGLE_CORRECT',
                questionText: qText,
                imageUrl: imgUrl,
                options: [
                  { id: 'A', label: optA },
                  { id: 'B', label: optB },
                  { id: 'C', label: optC },
                  { id: 'D', label: optD }
                ],
                correctAnswer: String(correctAns || 'A').toUpperCase().replace(/[^A-D]/g, '') || 'A',
                fullMarks: fullM,
                partialMarks: (qType === 'MULTI_CORRECT' || matchedSec.type === 'MULTI_CORRECT') ? 1 : 0,
                wrongMarks: wrongM
              });
            }
          } else {
            // Specific Sub-Section Format
            const isInteger = activeSubSec.type === 'INTEGER';
            if (isInteger) {
              const qText = cols[0];
              const correctVal = cols[1] || '0';
              const imgUrl = cols[2] || '';
              parsedQuestions.push({
                questionId: 'q_' + Date.now() + '_' + (idx + 1) + '_' + Math.floor(Math.random()*1000),
                subSectionName: activeSubSec.name,
                questionNumber: 1,
                questionType: 'INTEGER',
                questionText: qText,
                imageUrl: imgUrl,
                options: [],
                correctAnswer: correctVal,
                fullMarks: activeSubSec.fullMarks !== undefined ? activeSubSec.fullMarks : 4,
                partialMarks: 0,
                wrongMarks: activeSubSec.wrongMarks !== undefined ? activeSubSec.wrongMarks : 0
              });
            } else {
              const qText = cols[0];
              const optA = cols[1] || '';
              const optB = cols[2] || '';
              const optC = cols[3] || '';
              const optD = cols[4] || '';
              const correctAns = (cols[5] || 'A').toUpperCase().replace(/[^A-D]/g, '');
              const imgUrl = cols[6] || '';

              parsedQuestions.push({
                questionId: 'q_' + Date.now() + '_' + (idx + 1) + '_' + Math.floor(Math.random()*1000),
                subSectionName: activeSubSec.name,
                questionNumber: 1,
                questionType: activeSubSec.type,
                questionText: qText,
                imageUrl: imgUrl,
                options: [
                  { id: 'A', label: optA },
                  { id: 'B', label: optB },
                  { id: 'C', label: optC },
                  { id: 'D', label: optD }
                ],
                correctAnswer: correctAns || 'A',
                fullMarks: activeSubSec.fullMarks !== undefined ? activeSubSec.fullMarks : 4,
                partialMarks: activeSubSec.partialMarks !== undefined ? activeSubSec.partialMarks : 1,
                wrongMarks: activeSubSec.wrongMarks !== undefined ? activeSubSec.wrongMarks : -1
              });
            }
          }
        });

        if (!parsedQuestions.length) {
          alert('Could not parse questions. Please check the columns and try again.');
          return;
        }

        if (!currentSubject.questions) currentSubject.questions = [];

        if (isWhole) {
          if (mode === 'REPLACE') {
            currentSubject.questions = parsedQuestions;
          } else {
            currentSubject.questions = currentSubject.questions.concat(parsedQuestions);
          }
        } else {
          if (mode === 'REPLACE') {
            currentSubject.questions = currentSubject.questions.filter(q => q.subSectionName !== activeSubSec.name).concat(parsedQuestions);
          } else {
            currentSubject.questions = currentSubject.questions.concat(parsedQuestions);
          }
        }

        // Update counts on each sub-section
        subSections.forEach(sec => {
          sec.count = currentSubject.questions.filter(q => q.subSectionName === sec.name).length;
        });

        recalcGlobalQuestionNumbers();
        persistDraftToStorage();
        closeBulkUploadModal();
        alert(`✅ Successfully imported ${parsedQuestions.length} questions into ${isWhole ? currentSubject.subjectName : activeSubSec.name}!`);
        renderWizardModal();
      }

      function parseCsvLine(line) {
        const result = [];
        let insideQuote = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            result.push(entry.trim().replace(/^["']|["']$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        result.push(entry.trim().replace(/^["']|["']$/g, ''));
        return result;
      }

      async function saveExamSettings(examId) {
        const existing = await callAdmin('getExamDetail', { token: adminState.token, examId });
        let assigned = document.getElementById('settingAssignedIds').value.split(',').map((item) => item.trim()).filter(Boolean);
        const targetClass = document.getElementById('settingTargetClass').value;

        if (!assigned.length) {
          const all = (adminState.students || []).filter(s => s.status === 'ACTIVE');
          if (!targetClass || targetClass === 'ALL') {
            assigned = all.map(s => s.studentId);
          } else {
            assigned = all.filter(s => String(s.className).toLowerCase() === targetClass.toLowerCase()).map(s => s.studentId);
          }
        }

        const payload = {
          ...existing,
          examName: document.getElementById('settingExamName').value.trim(),
          targetClass: targetClass,
          examDate: document.getElementById('settingExamDate').value,
          durationMinutes: Number(document.getElementById('settingDurationMinutes').value) || 90,
          availabilityStart: document.getElementById('settingAvailabilityStart').value ? new Date(document.getElementById('settingAvailabilityStart').value).toISOString() : '',
          availabilityEnd: document.getElementById('settingAvailabilityEnd').value ? new Date(document.getElementById('settingAvailabilityEnd').value).toISOString() : '',
          mode: document.getElementById('settingMode').value.trim(),
          resultMode: document.getElementById('settingResultMode').value.trim(),
          status: document.getElementById('settingExamStatus').value.trim(),
          assignedStudentIds: assigned
        };
        await callAdmin('saveExam', { token: adminState.token, data: payload });
        closeDrawer();
        await hydrateAdmin();
      }

      async function loginAdmin() {
        const passInput = document.getElementById('adminPassword');
        const password = passInput ? passInput.value : '';
        if (!password) {
          adminState.error = 'Please enter the admin password.';
          renderAdmin();
          return;
        }
        try {
          const result = await callAdmin('adminLogin', { password });
          if (!result || !result.token) {
            throw new Error('Login failed: No authorization token received.');
          }
          localStorage.setItem(TOKEN_STORAGE_KEY, result.token);
          sessionStorage.setItem('adminToken', result.token);
          adminState.token = result.token;
          adminState.error = '';
          await hydrateAdmin();
        } catch (err) {
          adminState.error = err && err.message ? err.message : 'Invalid password or connection error.';
          renderAdmin();
        }
      }

      async function logoutAdmin() {
        try {
          if (adminState.token) {
            await callAdmin('adminLogout', { token: adminState.token });
          }
        } catch (e) {
        } finally {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          sessionStorage.removeItem('adminToken');
          setAdminState({ token: '', error: '', dashboard: null, analytics: null, students: [], exams: [], classes: [] });
        }
      }

      async function hydrateAdmin() {
        if (!adminState.token) return;
        try {
          const appState = await callAdmin('getAdminAppState', { token: adminState.token });
          setAdminState({
            dashboard: appState.dashboard,
            students: appState.students || [],
            exams: appState.exams || [],
            classes: (appState.dashboard && appState.dashboard.classes) || [],
            analytics: appState.analytics || null,
            error: ''
          });
        } catch (err) {
          const msg = err && err.message ? err.message : '';
          if (msg.includes('expired') || msg.includes('invalid') || msg.includes('Unauthorized')) {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
            sessionStorage.removeItem('adminToken');
            adminState.token = '';
            adminState.error = 'Session expired. Please enter password to log in again.';
            renderAdmin();
          } else {
            adminState.error = msg || 'Could not load dashboard data.';
            renderAdmin();
          }
        }
      }

      function handleStudentBulkFileSelect(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          const content = e.target.result;
          const ta = document.getElementById('studentBulkPasteText');
          if (ta) ta.value = content;
        };
        reader.readAsText(file);

      async function executeStudentBulkImport() {
        const ta = document.getElementById('studentBulkPasteText');
        const rawText = (ta ? ta.value : '').trim();
        const defaultClass = (document.getElementById('studentBulkDefaultClass') ? document.getElementById('studentBulkDefaultClass').value.trim() : '') || 'Class 10';

        if (!rawText) {
          alert('⚠️ Please paste student rows or choose a CSV file first.');
          return;
        }

        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (!lines.length) {
          alert('⚠️ No valid lines detected in the text.');
          return;
        }

        const btn = document.getElementById('btnRunStudentBulkUpload');
        if (btn) {
          btn.disabled = true;
          btn.textContent = '⏳ Uploading Students...';
        }

        const parsedStudents = [];
        lines.forEach((line, idx) => {
          let parts = line.includes('\t') ? line.split('\t') : (line.includes('|') ? line.split('|') : parseCsvLine(line));
          parts = parts.map(p => (p || '').trim().replace(/^["']|["']$/g, ''));

          if (parts.length >= 2) {
            const firstCol = parts[0].toLowerCase();
            if (firstCol.includes('student name') || firstCol.includes('name') && parts[1].toLowerCase().includes('mobile')) {
              // Header row, skip
              return;
            }

            const name = parts[0];
            const mobile = parts[1].replace(/\D/g, '');
            const admissionNumber = parts[2] || '';
            const className = parts[3] || defaultClass;
            const status = (parts[4] || 'ACTIVE').toUpperCase();

            if (name && mobile) {
              parsedStudents.push({
                studentName: name,
                mobileNumber: mobile,
                admissionNumber: admissionNumber,
                className: className,
                status: status === 'INACTIVE' ? 'INACTIVE' : 'ACTIVE'
              });
            }
          }
        });

        if (!parsedStudents.length) {
          if (btn) { btn.disabled = false; btn.textContent = '🚀 Process & Upload Students'; }
          alert('⚠️ Could not extract valid student records. Ensure each line has at least Student Name and Mobile Number.');
          return;
        }

        try {
          const res = await callAdmin('bulkSaveStudents', {
            token: adminState.token,
            students: parsedStudents
          });

          closeStudentBulkModal();
          alert(`✅ Successfully imported / updated ${parsedStudents.length} students in Google Sheets!`);
          await hydrateAdmin();
        } catch (err) {
          alert('❌ Failed to upload students: ' + (err.message || String(err)));
          if (btn) {
            btn.disabled = false;
            btn.textContent = '🚀 Process & Upload Students';
          }
        }
      }

        const examId = adminState.selectedAnalyticsExamId;

      function openDrawer(content) {
        document.getElementById('drawer').innerHTML = content;
        document.getElementById('drawer').classList.add('open');
        document.getElementById('overlay').classList.add('open');
      }

      function closeDrawer() {
        document.getElementById('drawer').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');
      }

      function downloadFile(name, content) {
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        link.click();
        URL.revokeObjectURL(url);
      }

      function escapeJs(text) {
        return String(text === undefined || text === null ? '' : text).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      }

      function getApiBaseUrl() {
        const url = window.APP_CONFIG && window.APP_CONFIG.apiBaseUrl;
        if (!url) throw new Error('API base URL missing in config.js');
        return url;
      }

      function escapeHtml(text) {
        return String(text === undefined || text === null ? '' : text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(text) { return escapeHtml(text); }

      // Boot application & restore any working draft
      renderAdmin();
      if (adminState.token) {
        hydrateAdmin().catch(() => {});
      }
      restoreDraftFromStorage();

      window.addEventListener('beforeunload', (e) => {
