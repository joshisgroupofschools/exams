<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exam Management Software</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const BOOTSTRAP = {
        appName: (window.APP_CONFIG && window.APP_CONFIG.appName) || 'Exam Management Software'
      };

      const state = {
        view: 'login',
        loading: false,
        student: null,
        exams: [],
        activeExam: null,
        attemptBundle: null,
        result: null,
        activeSubjectId: null,
        activeQuestionId: null,
        answers: {},
        timerHandle: null,
        isSubmitting: false,
        error: ''
      };

      const STUDENT_STORAGE_KEY = 'examStudentId';

      function setState(patch) {
        Object.assign(state, patch);
        render();
      }

      function callServer(action, payload) {
        const apiBaseUrl = getApiBaseUrl();
        setState({ loading: true, error: '' });
        return fetch(apiBaseUrl, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: action,
            ...(payload || {})
          })
        }).then((response) => response.json())
          .then((result) => {
            state.loading = false;
            if (!result.ok) {
              throw new Error(result.error && result.error.message ? result.error.message : 'Something went wrong');
            }
            render();
            return result.data;
          })
          .catch((err) => {
            state.loading = false;
            state.error = err && err.message ? err.message : 'Something went wrong';
            render();
            throw err;
          });
      }

      function render() {
        const root = document.getElementById('app');
        root.innerHTML = `
          <div class="app-shell">
            ${renderTopbar()}
            ${state.error ? `<div class="panel" style="border-color: rgba(255,113,113,.35); margin-bottom: 16px;"><div class="pill-danger">${escapeHtml(state.error)}</div></div>` : ''}
            ${state.loading ? `<div class="loading">Loading...</div>` : ''}
            ${state.view === 'login' ? renderLogin() : ''}
            ${state.view === 'dashboard' ? renderDashboard() : ''}
            ${state.view === 'exam' ? renderExam() : ''}
            ${state.view === 'result' ? renderResult() : ''}
          </div>
        `;
      }

      function renderTopbar() {
        return `
          <div class="topbar">
            <div class="brand">
              <div class="brand-mark"></div>
              <div>
                <h1>${escapeHtml(BOOTSTRAP.appName)}</h1>
                <p>${state.student ? `Student Portal - ${escapeHtml(state.student.studentName)}` : 'Student Portal'}</p>
              </div>
            </div>
            <div class="row">
              ${state.student ? `<span class="badge">Hello ${escapeHtml(state.student.studentName)}</span>` : `<span class="badge">Secure student access</span>`}
              <button class="btn btn-secondary" onclick="location.href='admin.html'">Open Admin</button>
            </div>
          </div>
        `;
      }

      function renderLogin() {
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">Responsive mobile exam experience</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(2rem, 4vw, 3.6rem); line-height:1.05;">Enter your registered mobile number to access assigned exams.</h2>
              <p class="muted">Only exams assigned to your student record are shown. Progress, timer, answer state, and exam order are restored if you refresh during an active attempt.</p>
            </div>
            <div class="panel login-card">
              <div class="stack">
                <h3 style="margin:0;">Student Login</h3>
                <div class="field">
                  <label>Registered Mobile Number</label>
                  <input id="mobileNumber" class="input" type="tel" placeholder="Enter mobile number" />
                </div>
                <button class="btn btn-primary" onclick="studentLogin()">Continue</button>
                <p class="muted">Unknown or duplicate active mobile numbers are blocked by the server.</p>
              </div>
            </div>
          </div>
        `;
      }

      function renderDashboard() {
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">${escapeHtml(state.student.className || '')} ${escapeHtml(state.student.sectionName || '')}</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(1.8rem, 3.2vw, 3rem);">Assigned exams for ${escapeHtml(state.student.studentName)}</h2>
              <p class="muted">Start only when ready. The timer cannot be paused, and the server enforces the end time.</p>
            </div>
            <div class="grid cards-2">
              <div class="card kpi"><span class="muted">Assigned Exams</span><strong>${state.exams.length}</strong></div>
              <div class="card kpi"><span class="muted">Student ID</span><strong style="font-size:1.2rem;">${escapeHtml(state.student.admissionNumber)}</strong></div>
            </div>
          </div>
          <div class="panel">
            <div class="toolbar" style="margin-bottom:16px;">
              <h3 style="margin:0;">Available Exams</h3>
              <button class="btn btn-secondary" onclick="refreshStudentState()">Refresh</button>
            </div>
            <div class="list">
              ${state.exams.length ? state.exams.map(renderExamCard).join('') : `<div class="empty">No active exams are available right now.</div>`}
            </div>
          </div>
        `;
      }

      function renderExamCard(exam) {
        return `
          <div class="exam-card">
            <div class="stack">
              <div class="row">
                <strong style="font-size:1.1rem;">${escapeHtml(exam.examName)}</strong>
                <span class="badge">${escapeHtml(exam.mode)}</span>
              </div>
              <div class="row muted">
                <span>Date: ${escapeHtml(exam.examDate)}</span>
                <span>Duration: ${escapeHtml(exam.durationMinutes)} min</span>
                <span>Window: ${escapeHtml(exam.availabilityStart)} to ${escapeHtml(exam.availabilityEnd)}</span>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary" onclick="startExamFlow('${exam.examId}')">Start Exam</button>
            </div>
          </div>
        `;
      }

      function renderExam() {
        const bundle = state.attemptBundle || {};
        const subjects = bundle.subjects || [];
        const questions = getOrderedQuestions(bundle);
        const activeSubject = subjects.find((item) => item.examSubjectId === state.activeSubjectId) || subjects[0];
        const subjectQuestions = questions.filter((item) => item.examSubjectId === (activeSubject && activeSubject.examSubjectId));
        const activeQuestion = subjectQuestions.find((item) => item.questionId === state.activeQuestionId) || subjectQuestions[0];
        const answeredMap = state.answers;
        const remainingText = getRemainingTimeText(bundle.attempt && bundle.attempt.expiresAt);
        return `
          <div class="hero">
            <div class="toolbar">
              <div class="stack">
                <span class="badge">Hello ${escapeHtml(state.student.studentName)} - You have ${remainingText}</span>
                <h2 style="margin:8px 0 0;">${escapeHtml(bundle.exam ? bundle.exam.examName : '')}</h2>
              </div>
              <div class="row">
                <button class="btn btn-secondary" onclick="refreshAttempt()">Sync</button>
                <button class="btn btn-primary" onclick="submitAttempt(false)">Submit Exam</button>
              </div>
            </div>
          </div>
          <div class="question-shell">
            <div class="panel question-nav">
              <div class="stack">
                <h3 style="margin:0;">Question Navigator</h3>
                <div class="subject-tabs">
                  ${subjects.map((subject) => `<button class="subject-tab ${subject.examSubjectId === state.activeSubjectId ? 'active' : ''}" onclick="setSubject('${subject.examSubjectId}')">${escapeHtml(subject.subjectName)}</button>`).join('')}
                </div>
                <div class="question-grid">
                  ${subjectQuestions.map((question) => {
                    const value = answeredMap[question.questionId];
                    const answered = Array.isArray(value) ? value.length : value !== undefined && value !== null && value !== '';
                    return `<button class="qchip ${answered ? 'answered' : ''} ${question.questionId === state.activeQuestionId ? 'active' : ''}" onclick="setQuestion('${question.questionId}')">${escapeHtml(question.questionNumber)}</button>`;
                  }).join('')}
                </div>
                <div class="status">All questions are mandatory. Unanswered questions at timer end are scored using wrong-answer marks.</div>
              </div>
            </div>
            <div class="panel">
              ${activeQuestion ? renderQuestion(activeQuestion) : '<div class="empty">No question selected.</div>'}
            </div>
          </div>
        `;
      }

      function renderQuestion(question) {
        const options = getOrderedOptions(question);
        const currentAnswer = state.answers[question.questionId];
        const isMulti = question.questionType === 'MULTI_CORRECT';
        const isInteger = question.questionType === 'INTEGER';
        return `
          <div class="stack">
            <div class="row">
              <span class="badge">Q${escapeHtml(question.questionNumber)}</span>
              <span class="badge">${escapeHtml(question.questionType)}</span>
              <span class="badge">+${escapeHtml(question.fullMarks)} / ${escapeHtml(question.wrongMarks)}</span>
            </div>
            ${question.questionText ? `<div style="font-size:1.05rem; line-height:1.65;">${escapeHtml(question.questionText)}</div>` : `<div class="muted">Answer entry interface only. Question text is not required for physical paper mode.</div>`}
            ${question.imageUrl ? `<img src="${escapeAttribute(question.imageUrl)}" alt="Question Image" style="max-width:100%; border-radius:18px; border:1px solid rgba(255,255,255,.08);" />` : ''}
            ${isInteger ? `
              <div class="field">
                <label>Enter Integer Answer</label>
                <input class="input" type="number" value="${currentAnswer || ''}" onchange="saveIntegerAnswer('${question.questionId}', this.value)" />
              </div>
            ` : `
              <div class="options">
                ${options.map((option) => `
                  <label class="option">
                    <input ${isMulti ? 'type="checkbox"' : 'type="radio" name="singleOption"'} ${isOptionSelected(currentAnswer, option.id) ? 'checked' : ''} onchange="saveChoiceAnswer('${question.questionId}', '${option.id}', ${isMulti})" />
                    <div>
                      <strong>${escapeHtml(option.id)}</strong>
                      <div class="muted">${escapeHtml(option.label || '')}</div>
                    </div>
                  </label>
                `).join('')}
              </div>
            `}
            <div class="toolbar">
              <div class="status">Answers are saved to the server as you work.</div>
              <div class="row">
                <button class="btn btn-secondary" onclick="goPrevQuestion()">Previous</button>
                <button class="btn btn-secondary" onclick="goNextQuestion()">Next</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderResult() {
        const result = state.result || {};
        const score = result.score || {};
        const subjectEntries = Object.entries(score.subjectWise || {});
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">Result Summary</span>
              <h2 style="margin:8px 0 0;">${escapeHtml(result.exam ? result.exam.examName : '')}</h2>
              <p class="muted">This view shows marks, rank, average, subject performance, and a question-level review table.</p>
            </div>
            <div class="grid cards-2">
              <div class="card kpi"><span class="muted">Total Marks</span><strong>${Number(score.totalMarksObtained || 0).toFixed(2)} / ${Number(score.totalMarks || 0).toFixed(2)}</strong></div>
              <div class="card kpi"><span class="muted">Overall Rank</span><strong>${result.rank || 0}</strong></div>
            </div>
          </div>
          <div class="grid cards-4" style="margin-bottom:18px;">
            <div class="card kpi"><span class="muted">Ranked Students</span><strong>${result.totalRankedStudents || 0}</strong></div>
            <div class="card kpi"><span class="muted">Exam Average</span><strong>${Number(result.averageScore || 0).toFixed(2)}</strong></div>
            <div class="card kpi"><span class="muted">Time Taken</span><strong>${escapeHtml(formatDuration((result.attempt && result.attempt.timeTakenSeconds) || 0))}</strong></div>
            <div class="card kpi"><span class="muted">Submission</span><strong style="font-size:1rem;">${escapeHtml((result.attempt && result.attempt.status) || '')}</strong></div>
          </div>
          <div class="panel" style="margin-bottom:18px;">
            <h3 style="margin-top:0;">Subject-wise Performance</h3>
            <div class="grid cards-3">
              ${subjectEntries.length ? subjectEntries.map(([subjectId, item]) => `
                <div class="card">
                  <div class="stack">
                    <strong>${escapeHtml((result.subjectMap && result.subjectMap[subjectId]) || subjectId)}</strong>
                    <span class="muted">${Number(item.marksObtained || 0).toFixed(2)} / ${Number(item.totalMarks || 0).toFixed(2)}</span>
                    <span class="status pill-success">Correct: ${item.correct || 0}</span>
                    <span class="status pill-warning">Partial: ${item.partial || 0}</span>
                    <span class="status pill-danger">Wrong: ${item.wrong || 0}</span>
                    <span class="status">Unattempted: ${item.unattempted || 0}</span>
                  </div>
                </div>
              `).join('') : '<div class="empty">No subject summary available.</div>'}
            </div>
          </div>
          <div class="panel">
            <div class="toolbar" style="margin-bottom:16px;">
              <h3 style="margin:0;">Review Table</h3>
              <button class="btn btn-secondary" onclick="refreshStudentState()">Back to Dashboard</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Subject</th>
                    <th>Question</th>
                    <th>Your Answer</th>
                    <th>Correct Answer</th>
                    <th>Marks</th>
                  </tr>
                </thead>
                <tbody>
                  ${(result.review || []).map((item) => `
                    <tr>
                      <td>${escapeHtml(item.subject)}</td>
                      <td>${escapeHtml(item.questionNumber)}</td>
                      <td>${escapeHtml(Array.isArray(item.studentAnswer) ? item.studentAnswer.join('') : item.studentAnswer)}</td>
                      <td>${escapeHtml(item.correctAnswer)}</td>
                      <td>${escapeHtml(item.marksReceived)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      async function studentLogin() {
        const mobileNumber = document.getElementById('mobileNumber').value.trim();
        if (!mobileNumber) {
          setState({ error: 'Mobile number is required.' });
          return;
        }
        const result = await callServer('studentLogin', { mobileNumber });
        sessionStorage.setItem(STUDENT_STORAGE_KEY, result.student.studentId);
        setState({
          student: result.student,
          exams: result.exams,
          view: 'dashboard',
          result: null
        });
      }

      async function refreshStudentState() {
        if (!state.student) return;
        const result = await callServer('getStudentState', { studentId: state.student.studentId });
        stopTimer();
        setState({
          student: result.student,
          exams: result.exams,
          view: 'dashboard',
          activeExam: null,
          attemptBundle: null,
          answers: {},
          result: null
        });
      }

      async function startExamFlow(examId) {
        const bundle = await callServer('startExam', { studentId: state.student.studentId, examId });
        applyAttemptBundle(bundle);
      }

      async function refreshAttempt() {
        if (!state.attemptBundle) return;
        const bundle = await callServer('startExam', { studentId: state.student.studentId, examId: state.attemptBundle.exam.examId });
        const answers = {};
        (bundle.answers || []).forEach((answer) => {
          answers[answer.questionId] = parseJson(answer.answerJson, '');
        });
        setState({ attemptBundle: bundle, answers });
      }

      function setSubject(subjectId) {
        const firstQuestion = getOrderedQuestions(state.attemptBundle).find((item) => item.examSubjectId === subjectId);
        setState({
          activeSubjectId: subjectId,
          activeQuestionId: firstQuestion && firstQuestion.questionId
        });
      }

      function setQuestion(questionId) {
        setState({ activeQuestionId: questionId });
      }

      function goPrevQuestion() {
        moveQuestion(-1);
      }

      function goNextQuestion() {
        moveQuestion(1);
      }

      function moveQuestion(step) {
        const questions = getOrderedQuestions(state.attemptBundle).filter((item) => item.examSubjectId === state.activeSubjectId);
        const index = questions.findIndex((item) => item.questionId === state.activeQuestionId);
        const next = questions[index + step];
        if (next) setState({ activeQuestionId: next.questionId });
      }

      async function saveIntegerAnswer(questionId, value) {
        state.answers[questionId] = value;
        render();
        const response = await callServer('saveAnswer', {
          studentId: state.student.studentId,
          attemptId: state.attemptBundle.attempt.attemptId,
          questionId,
          answer: value
        });
        if (response && response.exam && response.attempt) {
          stopTimer();
          setState({ result: response, view: 'result', isSubmitting: false });
        }
      }

      async function saveChoiceAnswer(questionId, optionId, isMulti) {
        let answer = state.answers[questionId];
        if (isMulti) {
          answer = Array.isArray(answer) ? answer.slice() : [];
          const index = answer.indexOf(optionId);
          if (index > -1) answer.splice(index, 1);
          else answer.push(optionId);
        } else {
          answer = optionId;
        }
        state.answers[questionId] = answer;
        render();
        const response = await callServer('saveAnswer', {
          studentId: state.student.studentId,
          attemptId: state.attemptBundle.attempt.attemptId,
          questionId,
          answer
        });
        if (response && response.exam && response.attempt) {
          stopTimer();
          setState({ result: response, view: 'result', isSubmitting: false });
        }
      }

      async function submitAttempt(isAuto) {
        if (state.isSubmitting) return;
        const totalQuestions = (state.attemptBundle.questions || []).length;
        const answeredQuestions = Object.values(state.answers).filter((value) => Array.isArray(value) ? value.length : value !== undefined && value !== null && value !== '').length;
        if (!isAuto && answeredQuestions < totalQuestions) {
          const missing = (state.attemptBundle.questions || []).filter((item) => {
            const value = state.answers[item.questionId];
            return Array.isArray(value) ? !value.length : value === undefined || value === null || value === '';
          }).map((item) => item.questionNumber);
          setState({ error: `Answer all questions before submitting. Missing: ${missing.join(', ')}` });
          return;
        }
        state.isSubmitting = true;
        const result = await callServer('finalizeAttempt', {
          studentId: state.student.studentId,
          attemptId: state.attemptBundle.attempt.attemptId,
          isAutoSubmit: !!isAuto
        });
        stopTimer();
        setState({ result, view: 'result', isSubmitting: false });
      }

      function startTimer() {
        stopTimer();
        state.timerHandle = setInterval(() => {
          render();
          const remaining = getRemainingMillis(state.attemptBundle && state.attemptBundle.attempt && state.attemptBundle.attempt.expiresAt);
          if (remaining <= 0) {
            stopTimer();
            submitAttempt(true);
          }
        }, 1000);
      }

      function stopTimer() {
        if (state.timerHandle) {
          clearInterval(state.timerHandle);
          state.timerHandle = null;
        }
      }

      function getRemainingMillis(expiresAt) {
        return Math.max(0, new Date(expiresAt).getTime() - Date.now());
      }

      function getRemainingTimeText(expiresAt) {
        return formatDuration(Math.floor(getRemainingMillis(expiresAt) / 1000));
      }

      function formatDuration(totalSeconds) {
        const seconds = Math.max(0, Number(totalSeconds || 0));
        const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
      }

      function parseJson(text, fallback) {
        try { return text ? JSON.parse(text) : fallback; } catch (e) { return fallback; }
      }

      function getOrderedQuestions(bundle) {
        const questions = (bundle && bundle.questions) || [];
        const questionOrder = parseJson(bundle && bundle.attempt && bundle.attempt.questionOrderJson, {});
        const ordered = [];
        const consumed = new Set();
        Object.keys(questionOrder).forEach((subjectId) => {
          (questionOrder[subjectId] || []).forEach((questionId) => {
            const question = questions.find((item) => item.questionId === questionId);
            if (question) {
              ordered.push(question);
              consumed.add(questionId);
            }
          });
        });
        questions.forEach((question) => {
          if (!consumed.has(question.questionId)) ordered.push(question);
        });
        return ordered;
      }

      function getOrderedOptions(question) {
        const options = parseJson(question.optionsJson, []);
        const optionOrder = parseJson(state.attemptBundle && state.attemptBundle.attempt && state.attemptBundle.attempt.optionOrderJson, {});
        const orderedIds = optionOrder[question.questionId] || [];
        const ordered = [];
        const consumed = new Set();
        orderedIds.forEach((id) => {
          const option = options.find((item) => item.id === id);
          if (option) {
            ordered.push(option);
            consumed.add(id);
          }
        });
        options.forEach((option) => {
          if (!consumed.has(option.id)) ordered.push(option);
        });
        return ordered;
      }

      function isOptionSelected(currentAnswer, optionId) {
        return Array.isArray(currentAnswer) ? currentAnswer.includes(optionId) : currentAnswer === optionId;
      }

      function applyAttemptBundle(bundle) {
        const answers = {};
        (bundle.answers || []).forEach((answer) => {
          answers[answer.questionId] = parseJson(answer.answerJson, '');
        });
        const firstSubject = (bundle.subjects || [])[0];
        const firstQuestion = getOrderedQuestions(bundle).find((item) => item.examSubjectId === (firstSubject && firstSubject.examSubjectId));
        setState({
          activeExam: bundle.exam,
          attemptBundle: bundle,
          answers,
          activeSubjectId: firstSubject && firstSubject.examSubjectId,
          activeQuestionId: firstQuestion && firstQuestion.questionId,
          view: 'exam',
          isSubmitting: false
        });
        startTimer();
      }

      async function restoreStudentSession() {
        const studentId = sessionStorage.getItem(STUDENT_STORAGE_KEY);
        if (!studentId) return;
        try {
          const portalState = await callServer('getStudentPortalState', { studentId });
          if (!portalState || !portalState.student) return;
          if (portalState.activeAttemptBundle) {
            setState({
              student: portalState.student,
              exams: portalState.exams
            });
            applyAttemptBundle(portalState.activeAttemptBundle);
            return;
          }
          if (portalState.latestResult) {
            setState({
              student: portalState.student,
              exams: portalState.exams,
              result: portalState.latestResult,
              view: 'result'
            });
            return;
          }
          setState({
            student: portalState.student,
            exams: portalState.exams,
            view: 'dashboard'
          });
        } catch (err) {
          sessionStorage.removeItem(STUDENT_STORAGE_KEY);
        }
      }

      function getApiBaseUrl() {
        const url = window.APP_CONFIG && window.APP_CONFIG.apiBaseUrl;
        if (!url) {
          throw new Error('API base URL is missing. Set window.APP_CONFIG.apiBaseUrl in config.js.');
        }
        return url;
      }

      function escapeHtml(text) {
        return String(text === undefined || text === null ? '' : text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(text) {
        return escapeHtml(text);
      }

      render();
      restoreStudentSession();
    </script>
  </body>
</html>
