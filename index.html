<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exam Management Software - Student Portal</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <style>
      .timing-pill {
        background: rgba(94, 200, 255, 0.12);
        border: 1px solid rgba(94, 200, 255, 0.3);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 0.85rem;
        color: #5ec8ff;
      }
      .sec-badge {
        background: rgba(123, 255, 207, 0.15);
        color: #7bffcf;
        border: 1px solid rgba(123, 255, 207, 0.3);
        font-size: 0.8rem;
        padding: 2px 8px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const BOOTSTRAP = {
        appName: (window.APP_CONFIG && window.APP_CONFIG.appName) || 'Exam Management Software'
      };

      const state = {
        view: 'login',
        loading: false,
        student: null,
        exams: [],
        activeExam: null,
        attemptBundle: null,
        result: null,
        activeSubjectId: null,
        activeQuestionId: null,
        answers: {},
        timerHandle: null,
        isSubmitting: false,
        error: '',
        syncStatus: 'Saved'
      };

      const STUDENT_STORAGE_KEY = 'ems_active_student_id';

      function setState(patch) {
        Object.assign(state, patch);
        render();
      }

      function callServer(action, payload, silent) {
        const apiBaseUrl = getApiBaseUrl();
        if (!silent) setState({ loading: true, error: '' });
        return fetch(apiBaseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, ...(payload || {}) })
        }).then((response) => response.json())
          .then((result) => {
            if (!silent) state.loading = false;
            if (!result.ok) {
              throw new Error(result.error && result.error.message ? result.error.message : 'Something went wrong');
            }
            if (!silent) render();
            return result.data;
          })
          .catch((err) => {
            if (!silent) {
              state.loading = false;
              state.error = err && err.message ? err.message : 'Something went wrong';
              render();
            }
            throw err;
          });
      }

      function render() {
        const root = document.getElementById('app');
        root.innerHTML = `
          <div class="app-shell">
            ${renderTopbar()}
            ${state.error ? `<div class="panel" style="border-color: rgba(255,113,113,.35); margin-bottom: 16px;"><div class="pill-danger">${escapeHtml(state.error)}</div></div>` : ''}
            ${state.loading ? `<div class="loading">Loading instantly...</div>` : ''}
            ${state.view === 'login' ? renderLogin() : ''}
            ${state.view === 'dashboard' ? renderDashboard() : ''}
            ${state.view === 'exam' ? renderExam() : ''}
            ${state.view === 'result' ? renderResult() : ''}
          </div>
        `;
      }

      function renderTopbar() {
        return `
          <div class="topbar">
            <div class="brand">
              <div class="brand-mark">EMS</div>
              <div>
                <h1>${escapeHtml(BOOTSTRAP.appName)}</h1>
                <p>${state.student ? `Student: ${escapeHtml(state.student.studentName)} (${escapeHtml(state.student.className)})` : 'Student Portal'}</p>
              </div>
            </div>
            <div class="row">
              ${state.student ? `<span class="badge">👤 ${escapeHtml(state.student.studentName)}</span>` : `<span class="badge">Student Access</span>`}
              <button class="btn btn-secondary" onclick="location.href='admin.html'">Admin Portal</button>
            </div>
          </div>
        `;
      }

      function renderLogin() {
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">Online Examination Portal</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(2rem, 4vw, 3.6rem); line-height:1.05;">Student Sign In</h2>
              <p class="muted">Enter your registered mobile number to take your exam. Your answers are auto-saved to the cloud with every click.</p>
            </div>
            <div class="panel login-card">
              <div class="stack">
                <h3 style="margin:0;">Sign In</h3>
                <div class="field">
                  <label>Registered Mobile Number</label>
                  <input id="mobileNumber" class="input" type="tel" placeholder="e.g. 9876543210" onkeypress="if(event.key==='Enter') studentLogin()" />
                </div>
                <button class="btn btn-primary" onclick="studentLogin()">Login & View Exams</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderDashboard() {
        const submittedCount = (state.exams || []).filter((e) => e.hasAttempt && (e.attemptStatus === 'SUBMITTED' || e.attemptStatus === 'AUTO_SUBMITTED')).length;
        const liveCount = (state.exams || []).length;
        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge">${escapeHtml(state.student.className || 'Class')} · Dashboard</span>
              <h2 style="margin:10px 0 8px; font-size:clamp(1.8rem, 3.2vw, 3rem);">Welcome, ${escapeHtml(state.student.studentName)}</h2>
              <p class="muted">View your assigned examinations, live class rank, and performance analytics in real time.</p>
            </div>
            <div class="grid cards-2">
              <div class="card kpi"><span class="muted">Available Exams</span><strong>${liveCount}</strong></div>
              <div class="card kpi"><span class="muted">Completed Exams</span><strong style="color:var(--accent);">${submittedCount}</strong></div>
            </div>
          </div>
          <div class="panel">
            <div class="toolbar" style="margin-bottom:16px;">
              <h3 style="margin:0;">Assigned Examinations</h3>
              <button class="btn btn-secondary" onclick="refreshStudentState()">🔄 Refresh Live Status</button>
            </div>
            <div class="list" style="display:flex; flex-direction:column; gap:16px;">
              ${state.exams.length ? state.exams.map(renderExamCard).join('') : `<div class="empty">No live exams assigned right now. Your administrator/teacher will publish exams soon.</div>`}
            </div>
          </div>
        `;
      }

      function renderExamCard(exam) {
        const isSubmitted = exam.hasAttempt && (exam.attemptStatus === 'SUBMITTED' || exam.attemptStatus === 'AUTO_SUBMITTED');
        const isInProgress = exam.hasAttempt && exam.attemptStatus === 'IN_PROGRESS';

        if (isSubmitted) {
          const stats = exam.liveStats || {};
          const score = exam.score || {};
          const totalMarks = Number(score.totalMarks || 100);
          const marksObtained = Number(score.totalMarksObtained !== undefined ? score.totalMarksObtained : 0);
          const percentage = totalMarks > 0 ? ((marksObtained / totalMarks) * 100).toFixed(1) : '0';

          return `
            <div class="exam-card submitted-card" style="border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.04); border-radius:14px; padding:18px;">
              <div class="stack" style="gap:14px;">
                <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:8px;">
                  <div class="row" style="gap:10px;">
                    <strong style="font-size:1.2rem; color:#fff;">${escapeHtml(exam.examName)}</strong>
                    <span class="badge" style="background:rgba(16,185,129,0.2); color:#10b981; font-weight:700;">✅ SUBMITTED</span>
                    <span class="badge">${escapeHtml(exam.mode || 'ONLINE EXAM')}</span>
                  </div>
                  <span class="muted" style="font-size:0.85rem;">Completed & Locked</span>
                </div>

                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
                  <div class="card kpi" style="padding:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(94, 200, 255, 0.25); border-radius:10px;">
                    <span class="muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px;">🏆 Live Rank</span>
                    <strong style="font-size:1.35rem; color:var(--accent); margin-top:2px;">#${stats.liveRank || 1} <span style="font-size:0.8rem; font-weight:normal; color:#888;">of ${stats.totalCandidates || 1}</span></strong>
                  </div>

                  <div class="card kpi" style="padding:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(123, 255, 207, 0.25); border-radius:10px;">
                    <span class="muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px;">🎯 Your Score</span>
                    <strong style="font-size:1.35rem; color:#7bffcf; margin-top:2px;">${marksObtained.toFixed(1)} <span style="font-size:0.8rem; font-weight:normal; color:#888;">/ ${totalMarks} (${percentage}%)</span></strong>
                  </div>

                  <div class="card kpi" style="padding:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255, 209, 102, 0.25); border-radius:10px;">
                    <span class="muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px;">📊 Class Average</span>
                    <strong style="font-size:1.35rem; color:#ffd166; margin-top:2px;">${Number(stats.classAverage || 0).toFixed(1)} <span style="font-size:0.8rem; font-weight:normal; color:#888;">/ ${totalMarks}</span></strong>
                  </div>

                  <div class="card kpi" style="padding:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255, 159, 67, 0.25); border-radius:10px;">
                    <span class="muted" style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px;">🥇 Top Score</span>
                    <strong style="font-size:1.35rem; color:#ff9f43; margin-top:2px;">${Number(stats.topScore || 0).toFixed(1)} <span style="font-size:0.8rem; font-weight:normal; color:#888;">/ ${totalMarks}</span></strong>
                  </div>
                </div>

                ${renderSubjectSummaryPills(score.subjectWise)}

                <div class="row" style="justify-content:space-between; align-items:center; margin-top:4px;">
                  <span class="muted" style="font-size:0.85rem; color:#10b981;">🔒 Re-attempts are locked. Exam submitted.</span>
                  <button class="btn btn-secondary" onclick="viewPerformanceSummary('${escapeAttribute(exam.examId)}')">📊 View Full Scorecard</button>
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div class="exam-card" style="border-radius:14px; padding:18px;">
            <div class="stack">
              <div class="row">
                <strong style="font-size:1.2rem;">${escapeHtml(exam.examName)}</strong>
                <span class="badge" style="background:#10b981/20; color:#10b981; font-weight:700;">🟢 LIVE</span>
                <span class="badge">${escapeHtml(exam.mode || 'ONLINE EXAM')}</span>
              </div>
              <div class="row muted" style="gap:16px; margin-top:4px;">
                <span>⏱️ Duration: <strong>${escapeHtml(exam.durationMinutes)} mins</strong></span>
                <span>🎯 Single Submission Only</span>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary" onclick="startExamFlow('${escapeAttribute(exam.examId)}')">${isInProgress ? 'Resume Exam →' : 'Start Exam Now →'}</button>
            </div>
          </div>
        `;
      }

      function renderSubjectSummaryPills(subjectWise) {
        if (!subjectWise) return '';
        const entries = Object.entries(subjectWise);
        if (!entries.length) return '';
        return `
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;">
            ${entries.map(([sId, s]) => `
              <span class="timing-pill" style="font-size:0.8rem; padding:4px 10px;">
                <strong>${escapeHtml(s.subjectName || sId)}:</strong> ${Number(s.marksObtained || 0).toFixed(1)} / ${Number(s.totalMarks || 0).toFixed(1)}
              </span>
            `).join('')}
          </div>
        `;
      }

      function renderExam() {
        const bundle = state.attemptBundle || {};
        const subjects = (bundle.subjects && bundle.subjects.length) ? bundle.subjects : [{ examSubjectId: 'default_subject', subjectName: 'Main Paper' }];
        const questions = getOrderedQuestions(bundle);
        const activeSubject = subjects.find((item) => String(item.examSubjectId || '').trim() === String(state.activeSubjectId || '').trim()) || subjects[0];
        
        let subjectQuestions = questions.filter((item) => String(item.examSubjectId || '').trim() === String(activeSubject && activeSubject.examSubjectId || '').trim());
        if (!subjectQuestions.length && questions.length > 0) {
          subjectQuestions = questions;
        }

        const activeQuestion = subjectQuestions.find((item) => String(item.questionId || '').trim() === String(state.activeQuestionId || '').trim()) || subjectQuestions[0] || questions[0];
        const answeredMap = state.answers || {};
        const remainingText = getRemainingTimeText(bundle.attempt && bundle.attempt.expiresAt);

        return `
          <div class="hero">
            <div class="toolbar">
              <div class="stack">
                <span id="timer-badge" class="badge" style="font-weight:700; color:var(--accent); font-size:0.95rem;">⏱️ Time Remaining: ${remainingText}</span>
                <h2 style="margin:8px 0 0;">${escapeHtml(bundle.exam ? bundle.exam.examName : 'Exam')}</h2>
              </div>
              <div class="row">
                <span class="status" id="sync-indicator" style="margin-right:8px;">${escapeHtml(state.syncStatus)}</span>
                <button class="btn btn-primary" onclick="submitAttempt(false)">Submit Exam</button>
              </div>
            </div>
          </div>
          <div class="question-shell">
            <div class="panel question-nav">
              <div class="stack">
                <h3 style="margin:0;">Question Navigator</h3>
                <div class="subject-tabs">
                  ${subjects.map((subject) => `<button class="subject-tab ${String(subject.examSubjectId || '').trim() === String(activeSubject && activeSubject.examSubjectId || '').trim() ? 'active' : ''}" onclick="setSubject('${escapeAttribute(subject.examSubjectId)}')">${escapeHtml(subject.subjectName)}</button>`).join('')}
                </div>
                <div class="question-grid">
                  ${subjectQuestions.map((question) => {
                    const value = answeredMap[question.questionId];
                    const answered = Array.isArray(value) ? value.length > 0 : value !== undefined && value !== null && value !== '';
                    return `<button class="qchip ${answered ? 'answered' : ''} ${String(question.questionId || '').trim() === String(activeQuestion && activeQuestion.questionId || '').trim() ? 'active' : ''}" onclick="setQuestion('${escapeAttribute(question.questionId)}')">${escapeHtml(question.displayNumber || question.questionNumber)}</button>`;
                  }).join('')}
                </div>
                <div class="status">Total Questions: <strong>${questions.length}</strong></div>
              </div>
            </div>
            <div class="panel">
              ${activeQuestion ? renderQuestion(activeQuestion) : '<div class="empty">No question found for this paper.</div>'}
            </div>
          </div>
        `;
      }

      function renderQuestion(question) {
        const options = getOrderedOptions(question);
        const currentAnswer = state.answers[question.questionId];
        const isMulti = question.questionType === 'MULTI_CORRECT';
        const isInteger = question.questionType === 'INTEGER';

        return `
          <div class="stack">
            <div class="row">
              <span class="badge" style="font-weight:bold;">Question ${escapeHtml(question.displayNumber || question.questionNumber)}</span>
              ${question.subSectionName ? `<span class="sec-badge">${escapeHtml(question.subSectionName)}</span>` : ''}
              <span class="badge">${escapeHtml(question.questionType)}</span>
              <span class="badge" style="color:var(--accent);">+${escapeHtml(question.fullMarks)} / ${escapeHtml(question.wrongMarks)} ${isMulti ? `(Partial: +${escapeHtml(question.partialMarks || 1)})` : ''}</span>
            </div>
            ${question.questionText ? `<div style="font-size:1.1rem; line-height:1.6; margin:10px 0;">${escapeHtml(question.questionText)}</div>` : ''}
            ${question.imageUrl ? `<img src="${escapeAttribute(question.imageUrl)}" alt="Question Diagram" style="max-width:100%; max-height:400px; object-fit:contain; border-radius:14px; margin:8px 0;" />` : ''}
            
            ${isInteger ? `
              <div class="field" style="margin-top:14px;">
                <label>Enter Numerical / Integer Answer</label>
                <input class="input" type="number" step="any" value="${currentAnswer !== undefined ? currentAnswer : ''}" oninput="saveIntegerAnswer('${question.questionId}', this.value)" placeholder="Type numerical value" />
              </div>
            ` : `
              <div class="options" style="margin-top:14px;">
                ${options.map((option) => `
                  <label class="option" style="cursor:pointer;">
                    <input ${isMulti ? 'type="checkbox"' : `type="radio" name="question_${question.questionId}"`} ${isOptionSelected(currentAnswer, option.id) ? 'checked' : ''} onchange="saveChoiceAnswer('${question.questionId}', '${option.id}', ${isMulti})" />
                    <div>
                      <strong>(${escapeHtml(option.displayLetter || option.id)})</strong>
                      ${option.label ? `<span class="muted" style="margin-left:8px;">${escapeHtml(option.label)}</span>` : ''}
                    </div>
                  </label>
                `).join('')}
              </div>
            `}
            <div class="toolbar" style="margin-top:24px;">
              <button class="btn btn-secondary" onclick="goPrevQuestion()">← Previous Question</button>
              <button class="btn btn-secondary" onclick="goNextQuestion()">Next Question →</button>
            </div>
          </div>
        `;
      }

      function renderResult() {
        const result = state.result || {};
        const score = result.score || {};
        const stats = result.liveStats || {};
        const subjectEntries = Object.entries(score.subjectWise || {});
        const totalMarks = Number(score.totalMarks || 100);
        const marksObtained = Number(score.totalMarksObtained !== undefined ? score.totalMarksObtained : 0);
        const percentage = totalMarks > 0 ? ((marksObtained / totalMarks) * 100).toFixed(1) : '0';

        return `
          <div class="hero hero-grid">
            <div class="stack">
              <span class="badge" style="background:rgba(16,185,129,0.2); color:#10b981;">✅ Exam Submitted Successfully</span>
              <h2 style="margin:8px 0 0;">${escapeHtml(result.exam ? result.exam.examName : 'Exam Performance')}</h2>
              <p class="muted">Your exam has been submitted and locked. Re-attempts are not allowed.</p>
            </div>
            <div class="grid cards-2">
              <div class="card kpi" style="border: 1px solid rgba(94, 200, 255, 0.3);"><span class="muted">🏆 Live Rank in Class</span><strong style="color:var(--accent); font-size:1.6rem;">#${stats.liveRank || 1} <span style="font-size:0.95rem; font-weight:normal; color:#888;">of ${stats.totalCandidates || 1}</span></strong></div>
              <div class="card kpi" style="border: 1px solid rgba(123, 255, 207, 0.3);"><span class="muted">🎯 Your Final Score</span><strong style="color:#7bffcf; font-size:1.6rem;">${marksObtained.toFixed(1)} <span style="font-size:0.95rem; font-weight:normal; color:#888;">/ ${totalMarks} (${percentage}%)</span></strong></div>
            </div>
          </div>

          <div class="grid cards-2" style="margin-bottom:18px;">
            <div class="card kpi"><span class="muted">📊 Live Class Average</span><strong style="color:#ffd166; font-size:1.3rem;">${Number(stats.classAverage || 0).toFixed(1)} / ${totalMarks}</strong></div>
            <div class="card kpi"><span class="muted">🥇 Top Score in Class</span><strong style="color:#ff9f43; font-size:1.3rem;">${Number(stats.topScore || 0).toFixed(1)} / ${totalMarks}</strong></div>
          </div>

          <div class="panel" style="margin-bottom:18px;">
            <div class="toolbar" style="margin-bottom:16px;">
              <h3 style="margin:0;">Subject-Wise Performance Breakdown</h3>
              <button class="btn btn-primary" onclick="refreshStudentState()">Return to Dashboard</button>
            </div>
            <div class="grid cards-3">
              ${subjectEntries.length ? subjectEntries.map(([subjectId, item]) => `
                <div class="card" style="padding:16px; border:1px solid rgba(255,255,255,0.08);">
                  <div class="stack" style="gap:8px;">
                    <strong style="font-size:1.1rem; color:#fff;">${escapeHtml((result.subjectMap && result.subjectMap[subjectId]) || item.subjectName || subjectId)}</strong>
                    <span style="font-size:1.2rem; font-weight:bold; color:var(--accent);">${Number(item.marksObtained || 0).toFixed(1)} / ${Number(item.totalMarks || 0).toFixed(1)} marks</span>
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                      <span class="status pill-success">✓ Correct: ${item.correct || 0}</span>
                      <span class="status pill-warning">~ Partial: ${item.partial || 0}</span>
                      <span class="status pill-danger">✗ Wrong: ${item.wrong || 0}</span>
                      <span class="status">Unattempted: ${item.unattempted || 0}</span>
                    </div>
                  </div>
                </div>
              `).join('') : '<div class="empty">No subject breakdown available.</div>'}
            </div>
          </div>
        `;
      }

      function viewPerformanceSummary(examId) {
        const exam = (state.exams || []).find((e) => String(e.examId || '').trim() === String(examId || '').trim());
        if (exam && exam.score) {
          setState({
            result: {
              exam: exam,
              student: state.student,
              score: exam.score,
              liveStats: exam.liveStats,
              subjectMap: {}
            },
            view: 'result',
            error: ''
          });
          return;
        }
        startExamFlow(examId);
      }

      async function studentLogin() {
        const input = document.getElementById('mobileNumber');
        const mobileNumber = input ? input.value.trim() : '';
        if (!mobileNumber) {
          setState({ error: 'Please enter your registered mobile number.' });
          return;
        }

        try {
          const result = await callServer('studentLogin', { mobileNumber });
          sessionStorage.setItem(STUDENT_STORAGE_KEY, result.student.studentId);
          setState({
            student: result.student,
            exams: result.exams,
            view: 'dashboard',
            result: null,
            error: ''
          });
        } catch (e) {}
      }

      async function refreshStudentState() {
        if (!state.student) return;
        try {
          const result = await callServer('getStudentState', { studentId: state.student.studentId });
          stopTimer();
          setState({
            student: result.student,
            exams: result.exams,
            view: 'dashboard',
            activeExam: null,
            attemptBundle: null,
            answers: {},
            result: null,
            error: ''
          });
        } catch (e) {}
      }

      async function startExamFlow(examId) {
        try {
          const bundle = await callServer('startExam', { studentId: state.student.studentId, examId });
          if (bundle && (bundle.alreadySubmitted || (bundle.attempt && (bundle.attempt.status === 'SUBMITTED' || bundle.attempt.status === 'AUTO_SUBMITTED')))) {
            setState({ result: bundle, view: 'result', isSubmitting: false, error: '' });
            return;
          }
          applyAttemptBundle(bundle);
        } catch (e) {
          setState({ error: e && e.message ? e.message : 'Unable to start exam' });
        }
      }

      function setSubject(subjectId) {
        state.activeSubjectId = subjectId;
        const allQuestions = getOrderedQuestions(state.attemptBundle);
        const subQuestions = allQuestions.filter((item) => String(item.examSubjectId || '').trim() === String(subjectId || '').trim());
        const targetQ = subQuestions[0] || allQuestions[0];
        state.activeQuestionId = targetQ ? targetQ.questionId : null;
        render();
      }

      function setQuestion(questionId) {
        state.activeQuestionId = questionId;
        render();
      }

      function goPrevQuestion() { moveQuestion(-1); }
      function goNextQuestion() { moveQuestion(1); }

      function moveQuestion(step) {
        const allQuestions = getOrderedQuestions(state.attemptBundle);
        let questions = allQuestions.filter((item) => String(item.examSubjectId || '').trim() === String(state.activeSubjectId || '').trim());
        if (!questions.length) questions = allQuestions;

        const index = questions.findIndex((item) => String(item.questionId || '').trim() === String(state.activeQuestionId || '').trim());
        const next = questions[index + step];
        if (next) {
          state.activeQuestionId = next.questionId;
          render();
        }
      }

      let saveDebounceTimer = null;
      function saveIntegerAnswer(questionId, value) {
        state.answers[questionId] = value;
        updateSyncIndicator('Saving...');
        clearTimeout(saveDebounceTimer);
        saveDebounceTimer = setTimeout(() => {
          syncAnswerToServer(questionId, value);
        }, 500);
      }

      function saveChoiceAnswer(questionId, optionId, isMulti) {
        let answer = state.answers[questionId];
        if (isMulti) {
          answer = Array.isArray(answer) ? answer.slice() : (answer ? [answer] : []);
          const index = answer.indexOf(optionId);
          if (index > -1) answer.splice(index, 1);
          else answer.push(optionId);
        } else {
          answer = optionId;
        }
        state.answers[questionId] = answer;
        render();
        syncAnswerToServer(questionId, answer);
      }

      async function syncAnswerToServer(questionId, answer) {
        updateSyncIndicator('Saving...');
        try {
          const response = await callServer('saveAnswer', {
            studentId: state.student.studentId,
            attemptId: state.attemptBundle.attempt.attemptId,
            questionId,
            answer
          }, true);
          updateSyncIndicator('Saved ✓');
          if (response && response.exam && response.attempt) {
            stopTimer();
            setState({ result: response, view: 'result', isSubmitting: false });
          }
        } catch (e) {
          updateSyncIndicator('Saved (Local) ✓');
        }
      }

      function updateSyncIndicator(text) {
        state.syncStatus = text;
        const el = document.getElementById('sync-indicator');
        if (el) el.textContent = text;
      }

      async function submitAttempt(isAuto) {
        if (state.isSubmitting) return;
        if (!isAuto && !confirm('Are you sure you want to submit your exam now?')) {
          return;
        }
        state.isSubmitting = true;
        try {
          const result = await callServer('finalizeAttempt', {
            studentId: state.student.studentId,
            attemptId: state.attemptBundle.attempt.attemptId,
            isAutoSubmit: !!isAuto
          });
          stopTimer();
          setState({ result, view: 'result', isSubmitting: false, error: '' });
        } catch (e) {
          state.isSubmitting = false;
        }
      }

      function startTimer() {
        stopTimer();
        state.timerHandle = setInterval(() => {
          const expiresAt = state.attemptBundle && state.attemptBundle.attempt && state.attemptBundle.attempt.expiresAt;
          const remaining = getRemainingMillis(expiresAt);
          const badge = document.getElementById('timer-badge');
          if (badge) {
            badge.textContent = `⏱️ Time Remaining: ${getRemainingTimeText(expiresAt)}`;
          }
          if (remaining <= 0) {
            stopTimer();
            submitAttempt(true);
          }
        }, 1000);
      }

      function stopTimer() {
        if (state.timerHandle) {
          clearInterval(state.timerHandle);
          state.timerHandle = null;
        }
      }

      function getRemainingMillis(expiresAt) {
        if (!expiresAt) return 0;
        return Math.max(0, new Date(expiresAt).getTime() - Date.now());
      }

      function getRemainingTimeText(expiresAt) {
        return formatDuration(Math.floor(getRemainingMillis(expiresAt) / 1000));
      }

      function formatDuration(totalSeconds) {
        const seconds = Math.max(0, Number(totalSeconds || 0));
        const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
      }

      function parseJson(text, fallback) {
        try { return text ? JSON.parse(text) : fallback; } catch (e) { return fallback; }
      }

      function getOrderedQuestions(bundle) {
        const questions = (bundle && bundle.questions) || [];
        const questionOrder = parseJson(bundle && bundle.attempt && bundle.attempt.questionOrderJson, {});
        const ordered = [];
        const consumed = new Set();
        Object.keys(questionOrder).forEach((subjectId) => {
          (questionOrder[subjectId] || []).forEach((questionId) => {
            const question = questions.find((item) => String(item.questionId) === String(questionId));
            if (question) {
              ordered.push(question);
              consumed.add(String(questionId));
            }
          });
        });
        questions.forEach((question) => {
          if (!consumed.has(String(question.questionId))) ordered.push(question);
        });

        // Assign clean sequential question numbers per subject so students see standard 1, 2, 3...
        const subjectCounters = {};
        return ordered.map((q) => {
          const sId = q.examSubjectId || 'default';
          subjectCounters[sId] = (subjectCounters[sId] || 0) + 1;
          return {
            ...q,
            displayNumber: subjectCounters[sId]
          };
        });
      }

      function getOrderedOptions(question) {
        const options = parseJson(question.optionsJson, []);
        const optionOrder = parseJson(state.attemptBundle && state.attemptBundle.attempt && state.attemptBundle.attempt.optionOrderJson, {});
        const orderedIds = optionOrder[question.questionId] || [];
        const ordered = [];
        const consumed = new Set();
        orderedIds.forEach((id) => {
          const option = options.find((item) => String(item.id) === String(id));
          if (option) {
            ordered.push(option);
            consumed.add(String(id));
          }
        });
        options.forEach((option) => {
          if (!consumed.has(String(option.id))) ordered.push(option);
        });

        const letterMap = ['A', 'B', 'C', 'D', 'E', 'F'];
        return ordered.map((opt, idx) => ({
          ...opt,
          displayLetter: letterMap[idx] || String(idx + 1)
        }));
      }

      function isOptionSelected(currentAnswer, optionId) {
        return Array.isArray(currentAnswer) ? currentAnswer.includes(optionId) : String(currentAnswer) === String(optionId);
      }

      function applyAttemptBundle(bundle) {
        const answers = {};
        (bundle.answers || []).forEach((answer) => {
          answers[answer.questionId] = parseJson(answer.answerJson, '');
        });
        const allQuestions = getOrderedQuestions(bundle);
        const firstSubject = (bundle.subjects || [])[0] || { examSubjectId: 'default_subject' };
        const subQuestions = allQuestions.filter((item) => String(item.examSubjectId || '').trim() === String(firstSubject.examSubjectId || '').trim());
        const firstQuestion = subQuestions[0] || allQuestions[0];
        
        setState({
          activeExam: bundle.exam,
          attemptBundle: bundle,
          answers,
          activeSubjectId: firstSubject.examSubjectId,
          activeQuestionId: firstQuestion ? firstQuestion.questionId : null,
          view: 'exam',
          isSubmitting: false,
          error: ''
        });
        startTimer();
      }

      async function restoreStudentSession() {
        const studentId = localStorage.getItem(STUDENT_STORAGE_KEY) || sessionStorage.getItem(STUDENT_STORAGE_KEY);
        if (!studentId) return;
        try {
          const portalState = await callServer('getStudentPortalState', { studentId }, true);
          if (!portalState || !portalState.student) return;
          localStorage.setItem(STUDENT_STORAGE_KEY, studentId);
          sessionStorage.setItem(STUDENT_STORAGE_KEY, studentId);
          if (portalState.activeAttemptBundle) {
            setState({
              student: portalState.student,
              exams: portalState.exams
            });
            applyAttemptBundle(portalState.activeAttemptBundle);
            return;
          }
          setState({
            student: portalState.student,
            exams: portalState.exams,
            view: 'dashboard'
          });
        } catch (err) {
          localStorage.removeItem(STUDENT_STORAGE_KEY);
          sessionStorage.removeItem(STUDENT_STORAGE_KEY);
        }
      }

      function getApiBaseUrl() {
        const url = window.APP_CONFIG && window.APP_CONFIG.apiBaseUrl;
        if (!url) throw new Error('API base URL missing in config.js');
        return url;
      }

      function escapeHtml(text) {
        return String(text === undefined || text === null ? '' : text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(text) { return escapeHtml(text); }

      render();
      restoreStudentSession();
    </script>
  </body>
</html>
